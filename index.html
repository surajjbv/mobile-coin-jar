<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#95D3E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A4757" media="(prefers-color-scheme: dark)">
<title>Mobile Coin Jar</title>
<!-- anonymous visit count (GoatCounter): no cookies, no personal data; ignored on localhost -->
<script data-goatcounter="https://mobilecoinjar.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<meta name="apple-mobile-web-app-title" content="Coin Jar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<!-- module map first: browsers ignore one that arrives after module downloads have started -->
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.min.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "rapier":"https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
}}
</script>
<!-- start every 3D download at once, in parallel (the physics engine is the big one, ~1.5 MB) -->
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.min.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/environments/RoomEnvironment.js">
<style>
:root{
  --sky:#BFE6F0; --sky2:#8FD0E0; --top:#95D3E2; --ink:#173848; --gold:#F7C21A; --gold-dk:#C98A0E;
  --red:#D22F2F; --amber:#B86E00; --green:#23823A; --sheet:#FFFFFF; --muted:#5B7682;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky:#0F2E3A;--sky2:#1B4A5B;--top:#1A4757;--ink:#EAF6FA;--sheet:#17394A;--muted:#A6C3CE;--red:#FF6B6B;--amber:#FFB938;--green:#5FD37A}
}
:root[data-theme="dark"]{--sky:#0F2E3A;--sky2:#1B4A5B;--top:#1A4757;--ink:#EAF6FA;--sheet:#17394A;--muted:#A6C3CE;--red:#FF6B6B;--amber:#FFB938;--green:#5FD37A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* edge to edge: the page paints under the status bar, notch and home indicator; content keeps clear via safe-area insets */
/* iOS 26 Safari ignores theme-color and tints its bars from the page's base background colour, so that must be the top colour */
html{background:var(--top);height:100%}
body{margin:0;min-height:100lvh;background:var(--top) linear-gradient(180deg,var(--top),var(--sky) 75%) fixed;color:var(--ink);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;touch-action:none;
  -webkit-user-select:none;user-select:none;overflow:hidden;overscroll-behavior:none}
/* Safari tints its top bar from what touches the top edge: match the gradient's lightest (top) colour, not the page's darker base */
#tint{position:fixed;left:0;top:0;width:100vw;height:max(2px,env(safe-area-inset-top));background:var(--top);pointer-events:none;z-index:2}
#scene{position:fixed;left:0;top:0;width:100vw;height:100lvh;display:block;cursor:grab}
#fx{position:fixed;left:0;top:0;width:100vw;height:100lvh;pointer-events:none;z-index:3}
main{position:fixed;left:0;top:0;width:100vw;height:100dvh;pointer-events:none;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  padding:max(14px,calc(env(safe-area-inset-top) + 6px)) 16px max(14px,calc(env(safe-area-inset-bottom) + 6px))}
#top{display:flex;flex-direction:column;align-items:center}
#count{pointer-events:auto;background:none;border:0;color:var(--ink);font:inherit;font-weight:800;
  font-size:clamp(56px,17vw,88px);line-height:.9;letter-spacing:-.02em;cursor:pointer;
  display:flex;align-items:center;gap:.12em;padding:4px 8px}
#count.red{color:var(--red)}#count.amber{color:var(--amber)}#count.green{color:var(--green)}
#count .c{width:.7em;height:.7em;flex:none;filter:drop-shadow(0 .03em .02em rgba(0,0,0,.25))}
#count.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.12)}}
.sub{font-size:18px;font-weight:600;color:var(--muted)}
#label{margin-top:6px;padding:4px 14px;border-radius:999px;background:color-mix(in srgb,var(--sheet) 55%,transparent);
  font-size:18px;font-weight:700;max-width:88vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{margin:auto;font-size:18px;font-weight:600;color:var(--muted);text-align:center;max-width:320px;line-height:1.35}
#status .spin{display:inline-block;font-size:44px;animation:spin 1.2s linear infinite;margin-bottom:6px}
#status small{display:block;font-size:15px;font-weight:500;margin-top:8px}
@keyframes spin{to{transform:rotateY(360deg)}}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .9s;
  background:radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(0,0,0,.6) 100%)}
body.cinema #vignette{opacity:1}
body.cinema #bottom{opacity:0;pointer-events:none}body.cinema #bar{pointer-events:none}
#bottom{transition:opacity .6s;margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
#hint{font-size:16px;font-weight:600;color:var(--muted)}
/* pay bar: open to everyone; adding asks for a grown-up */
#bar{pointer-events:auto;width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;border-radius:26px;
  background:color-mix(in srgb,var(--sheet) 70%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#bar input{grid-column:1/-1;min-width:0;height:52px;border-radius:18px;border:2px solid var(--sky2);background:var(--sheet);color:var(--ink);
  font:inherit;font-size:24px;font-weight:700;text-align:center}
#bar button{height:52px;border:0;border-radius:18px;padding:0 16px;font:inherit;font-size:20px;font-weight:800;color:#fff;white-space:nowrap}
#pay{background:#D8443A}#add{background:#23823A}
#bar button:active{transform:scale(.97)}
#bar.shake{animation:shake .35s}
.float{position:fixed;z-index:4;pointer-events:none;font-weight:800;font-size:44px;animation:floatUp 1.5s ease-out forwards}
.float.out{color:var(--red)}.float.in{color:var(--green)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0) scale(1.1)}to{opacity:0;transform:translate(-50%,-80px) scale(.9)}}
@media (prefers-reduced-motion:reduce){#count.bump{animation:none}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,30,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.scrim.open{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:440px;border-radius:28px 28px 0 0;max-height:92dvh;overflow-y:auto;
  padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease;touch-action:pan-y}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{margin:0;text-align:center;font-size:24px}
.sheet p.hint{margin:2px 0 14px;text-align:center;color:var(--muted);font-size:16px;min-height:24px}
.sheet p.err{color:#D8443A}
.dots{display:flex;justify-content:center;gap:16px;margin:6px 0 18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--gold);border-color:var(--gold-dk)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:18px;border:0;background:var(--sky);color:var(--ink);font:inherit;font-size:28px;font-weight:700}
.pad button:active{transform:scale(.95)}
.pad button:disabled{opacity:.35}
.pad button.ghost{background:none;font-size:18px;color:var(--muted)}
label{display:block;font-size:16px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0;height:56px;border-radius:16px;border:2px solid var(--sky2);background:transparent;color:var(--ink);
  font:inherit;font-size:26px;font-weight:700;text-align:center}
.row input#gi{font-size:20px;font-weight:600}
.row button{height:56px;min-width:64px;border-radius:16px;border:0;background:var(--sky);color:var(--ink);font:inherit;font-size:20px;font-weight:700}
.quick{display:flex;gap:8px;margin-top:8px}
.quick button{flex:1;height:40px;border-radius:12px;border:0;background:var(--sky);color:var(--ink);font:inherit;font-size:16px;font-weight:600}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.emojis button{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--sky);font-size:22px}
.emojis button.on{border-color:var(--gold-dk);background:var(--gold)}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 10px}
.stars button{background:none;border:0;font-size:40px;line-height:1;padding:4px;filter:grayscale(1);opacity:.45;transition:transform .15s}
.stars button.on{filter:none;opacity:1;transform:scale(1.1)}
.sheet textarea,.sheet input.plain{width:100%;border-radius:16px;border:2px solid var(--sky2);background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:10px 12px}
.sheet textarea{min-height:96px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1;height:56px;border-radius:18px;border:0;font:inherit;font-size:20px;font-weight:700}
.primary{background:var(--gold);color:#3A2600}
.secondary{background:var(--sky);color:var(--ink)}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:16px;text-decoration:underline}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* ===== premium skin (styles inspired by uiverse.io patterns: jelly 3D buttons, glass cards, toggle switches) ===== */
:root{--glass:color-mix(in srgb,var(--sheet) 62%,transparent);--glass-edge:rgba(255,255,255,.28);--shadow:0 14px 34px rgba(4,20,30,.28)}
/* the count: a glass pill, the number filled with a glowing gradient (still red / amber / green), a coin that flips now and then */
#count{background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:6px 22px 6px 12px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35)}
#count #num{background:linear-gradient(180deg,var(--n1),var(--n2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px var(--glow)) drop-shadow(0 2px 0 rgba(0,0,0,.18))}
#count.red{--n1:#ffb3a8;--n2:#ff4d3d;--glow:rgba(255,77,61,.45)}
#count.amber{--n1:#ffe9a3;--n2:#ffa412;--glow:rgba(255,164,18,.45)}
#count.green{--n1:#c9ffd6;--n2:#2fcf5c;--glow:rgba(47,207,92,.45)}
#count .c{animation:flip 6s ease-in-out infinite;transform-origin:50% 50%}
@keyframes flip{0%,88%{transform:rotateY(0)}94%{transform:rotateY(180deg) scale(1.1)}100%{transform:rotateY(360deg)}}
.sub{margin-top:6px}
#label{background:var(--glass);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* the tilt hint: a pill with a gentle pulse */
#hint{padding:6px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 0 6px rgba(247,194,26,.18)}}
/* the pay bar: a frosted glass card */
#bar{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.3);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:10px;gap:10px}
#bar input{border:0;background:rgba(0,0,0,.18);box-shadow:inset 0 3px 8px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.12);
  color:var(--gold);font-size:28px;font-weight:800;letter-spacing:.02em}
#bar input::placeholder{color:var(--muted);font-weight:700;opacity:.8}
/* jelly buttons: glossy top, a solid base they sink into when pressed */
#bar button,.actions button,.row button,.quick button{position:relative;border:0;font-weight:800;
  background:linear-gradient(180deg,var(--j1),var(--j2));color:var(--jt,#fff);text-shadow:0 1px 1px rgba(0,0,0,.25);
  box-shadow:0 5px 0 var(--j3),0 10px 16px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.12);
  transition:transform .08s ease,box-shadow .08s ease;--j1:#5aa6c4;--j2:#2f7f9f;--j3:#1d5a73}
#bar button::before,.actions button::before{content:'';position:absolute;left:12%;right:12%;top:5px;height:36%;border-radius:999px;
  background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}
#bar button:active,.actions button:active,.row button:active,.quick button:active{transform:translateY(4px);
  box-shadow:0 1px 0 var(--j3),0 3px 6px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4)}
#bar #pay,.actions .danger{--j1:#ff8574;--j2:#e0412f;--j3:#9a2a1e}
#bar #add{--j1:#62da80;--j2:#22a045;--j3:#156a2b}
.actions .primary{--j1:#ffe27a;--j2:#f2b11a;--j3:#a8760a;--jt:#3a2600;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.actions .secondary,.row button,.quick button{--j1:color-mix(in srgb,var(--sky) 85%,#fff);--j2:var(--sky);--j3:color-mix(in srgb,var(--sky) 60%,#000);--jt:var(--ink);text-shadow:none}
/* the grown-ups sheet: a glass panel with a grab handle */
.scrim{background:rgba(6,20,30,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:linear-gradient(180deg,color-mix(in srgb,var(--sheet) 92%,#fff),var(--sheet));border:1px solid var(--glass-edge);border-bottom:0;
  box-shadow:0 -12px 40px rgba(0,0,0,.35);padding-top:30px;position:relative}
.sheet::before{content:'';position:absolute;top:10px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:9px;background:var(--muted);opacity:.45}
.sheet h2{font-size:26px;letter-spacing:-.01em}
.row input,.sheet textarea,.sheet input.plain{background:rgba(0,0,0,.08);border-color:transparent;box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
/* the passcode keypad: round glossy keys like a phone lock screen */
.pad{grid-template-columns:repeat(3,72px);justify-content:center;gap:14px 26px}
.pad button{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--sky) 70%,#fff),var(--sky));
  box-shadow:0 4px 10px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .08s,box-shadow .2s}
.pad button:active{transform:scale(.92);box-shadow:0 0 0 6px rgba(247,194,26,.35)}
.pad button.ghost{box-shadow:none;width:auto;border-radius:12px}
.dots i.on{box-shadow:0 0 10px var(--gold)}
/* on/off switches */
.switch{display:flex;align-items:center;justify-content:space-between;width:100%;margin:12px 0 0;padding:12px 14px;border:0;border-radius:16px;
  background:rgba(0,0,0,.07);color:var(--ink);font:inherit;font-size:17px;font-weight:700;text-align:left}
.switch i{flex:none;position:relative;width:54px;height:32px;border-radius:999px;background:color-mix(in srgb,var(--muted) 55%,transparent);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.3);transition:background .25s}
.switch i::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.switch.on i{background:linear-gradient(180deg,#62da80,#22a045)}
.switch.on i::after{transform:translateX(22px)}
/* the other menu links become chips */
.link{display:inline-block;margin:12px 4px 0;padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.07);text-decoration:none;font-weight:700}
#chg,#fb{display:inline-block}
.sheet>.link{display:table;margin:12px auto 0}
/* floating +N / -N: a soft glow */
.float{text-shadow:0 0 18px currentColor,0 2px 0 rgba(0,0,0,.2)}
/* a few twinkling sparkles in the background */
#twinkle{position:fixed;inset:0;pointer-events:none;z-index:0}
#twinkle i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff6c9;box-shadow:0 0 8px 2px rgba(255,230,140,.7);
  opacity:0;animation:twinkle 4.5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.75;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#count .c,#hint,#twinkle i{animation:none}}
</style>
</head>
<body>
<div id="tint" aria-hidden="true"></div>
<canvas id="scene" aria-label="A glass jar of coins. Tap to shake it, drag to spin it."></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="twinkle" aria-hidden="true"><i style="left:8%;top:22%;animation-delay:0s"></i><i style="left:88%;top:18%;animation-delay:1.2s"></i><i style="left:14%;top:64%;animation-delay:2.1s"></i><i style="left:92%;top:58%;animation-delay:0.6s"></i><i style="left:70%;top:10%;animation-delay:3.0s"></i><i style="left:24%;top:8%;animation-delay:1.7s"></i><i style="left:80%;top:78%;animation-delay:2.6s"></i><i style="left:6%;top:84%;animation-delay:0.9s"></i><i style="left:55%;top:6%;animation-delay:3.6s"></i><i style="left:96%;top:36%;animation-delay:1.4s"></i></div>
<main>
  <div id="top">
    <button id="count" aria-label="Coin count. Triple-tap to edit"><svg class="c" viewBox="-20 -20 40 40" aria-hidden="true">
      <defs>
        <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6C4"/><stop offset=".3" stop-color="#FFD84D"/><stop offset=".6" stop-color="#F3B41F"/><stop offset=".85" stop-color="#D4930F"/><stop offset="1" stop-color="#FFE27A"/></linearGradient>
        <path id="star" d="M0,-7L1.7,-2.35L6.66,-2.16L2.76,.9L4.11,5.66L0,2.9L-4.11,5.66L-2.76,.9L-6.66,-2.16L-1.7,-2.35Z"/>
      </defs>
      <circle r="19.5" fill="#A8700A"/><circle r="18" fill="url(#gA)"/>
      <circle r="15" fill="none" stroke="#B8800C" stroke-width="1.6"/><circle r="15" cy=".8" fill="none" stroke="#FFF1B8" stroke-width=".9" opacity=".8"/>
      <use href="#star" transform="translate(0 1) scale(1.35)" fill="#A8700A" opacity=".55"/><use href="#star" transform="scale(1.35)" fill="#FFE27A"/>
      <ellipse cx="-8" cy="-9" rx="5" ry="2.2" transform="rotate(-35 -8 -9)" fill="#fff" opacity=".7"/></svg><span id="num">0</span></button>
    <div class="sub" id="sub" hidden></div>
    <div id="label" hidden></div>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="bottom">
    <div id="hint" hidden>Tap the jar, then tilt your phone! 📱</div>
    <!-- like payment apps: one amount, money-in on the left, the main money-out action on the right (thumb side) -->
    <form id="bar" autocomplete="off">
      <input id="amt" type="number" inputmode="numeric" min="1" placeholder="Amount" aria-label="Amount">
      <button id="add" type="button" aria-label="Add coins (grown-ups only, needs the passcode)">＋ Add 🔒</button>
      <button id="pay" type="submit">Pay 💸</button>
    </form>
  </div>
</main>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
// ---- app state, sounds, confetti and the grown-ups sheet (plain script: works even if the 3D jar can't load) ----
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let state={coins:store.get('cj_coins',10),full:store.get('cj_full',100)};
let pin=store.get('cj_pin',null);
let label=store.get('cj_label',{e:'',t:''});
const CAP=10000; // most coins drawn (they get smaller as the jar holds more); above this each coin shown stands for more than one
let jar=null;  // the 3D jar, once its module has loaded
const APP_VERSION='2026.10.04-1'; // this phone's version; version.json on the site holds the latest (keep the two in step)

function wantedCoins(){
  return state.full<=CAP?Math.min(state.coins,state.full)
    :(state.coins>0?Math.max(1,Math.round(Math.min(state.coins/state.full,1)*CAP)):0);
}
function render(){
  if(jar)jar.update(wantedCoins(),Math.min(state.full,CAP));
  $('#num').textContent=state.coins.toLocaleString();

let master=null,noiseBuf=null;
function out(){ // everything goes through a limiter so a big pour doesn't distort

function tone(t,freq,amp,decay,type='sine',glideTo){

// A struck coin rings at a free metal disc's mode frequencies (inharmonic ratios below). Each mode is really two
// slightly detuned modes, which beat against each other: that shimmer is what makes it sound like metal, not a beep.
// Higher modes die away faster; a short band-passed noise burst gives the "chk" of the strike itself.
const COIN_MODES=[[1,1,1],[1.73,.55,.7],[2.33,.5,.55],[3.91,.3,.4],[4.11,.26,.35],[6.3,.14,.22]]; // [ratio, level, decay]
function coinStrike(ctx,dest,t,f,len,vol){
  if(!noiseBuf||noiseBuf.sampleRate!==ctx.sampleRate){
    noiseBuf=ctx.createBuffer(1,Math.round(ctx.sampleRate*.03),ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }

  if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=(Math.random()-.5)*.7;bus.connect(p);p.connect(dest)}else bus.connect(dest);

      o.connect(g);g.connect(bus);o.start(t);o.stop(end+.02);

const SAMPLES={clink:[1,2,3,4,5],bounce:[1,2,3,4],jingle:[1,2]};
let buffers=null;
async function loadSamples(){ // one at a time (clinks first), retrying once: gentle on a patchy phone connection
  if(buffers||!actx)return;buffers={clink:[],bounce:[],jingle:[]};
  for(const [kind,ids] of Object.entries(SAMPLES))for(const i of ids)for(let attempt=0;attempt<2;attempt++){
    try{
      const a=await (await fetch(`sounds/${kind}-${i}.m4a`)).arrayBuffer();

    }catch(e){}

}
function play(kind,vol,rate=1){

  if(actx.createStereoPanner){const p=actx.createStereoPanner();p.pan.value=(Math.random()-.5)*.6;g.connect(p);p.connect(out())}else g.connect(out());

function clink(vol=1,glass=false){ // glass: a coin hitting the jar rather than another coin

function noiseHit(freq,q,gain,dur,type){
  if(!audible())return;const t=actx.currentTime;

const fx=$('#fx'),fxc=fx.getContext('2d');let bits=[],fxRaf=0;
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)n=Math.round(n/4);
  const W=fx.width=innerWidth*devicePixelRatio,H=fx.height=fx.clientHeight*devicePixelRatio,s=devicePixelRatio;
  const cols=['#F7C21A','#FFE27A','#E2574C','#5FD37A','#4FB3E8','#F58BD0'];
  for(let i=0;i<n;i++)bits.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*14*s,vy:(-10-Math.random()*14)*s,
    w:(6+Math.random()*6)*s,h:(10+Math.random()*8)*s,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1});
  if(!fxRaf)fxRaf=requestAnimationFrame(fxTick);
}
function fxTick(){
  const s=devicePixelRatio;fxc.clearRect(0,0,fx.width,fx.height);
  bits=bits.filter(b=>b.life>0&&b.y<fx.height+40);
  for(const b of bits){
    b.vy+=.45*s;b.vx*=.99;b.vy*=.99;b.x+=b.vx;b.y+=b.vy;b.a+=b.va;b.life-=.006;
    fxc.save();fxc.globalAlpha=Math.min(1,b.life*3);fxc.translate(b.x,b.y);fxc.rotate(b.a);fxc.scale(1,Math.cos(b.a*2));

  }

}

  <label for="gi">Jar label (optional)</label>
  <div class="emojis">${EMOJI.map(e=>`<button data-e="${e}" class="${e===pick?'on':''}" aria-label="Use ${e}">${e}</button>`).join('')}</div>
  <div class="row"><input id="gi" type="text" maxlength="30" placeholder="e.g. Money in the phone" value="${esc(label.t)}"></div>
  <div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>
  <button class="switch" id="snd" role="switch"><span>🔊 Sounds &amp; vibration</span><i aria-hidden="true"></i></button>
  <button class="switch" id="tlt" role="switch"><span>📱 Tilt &amp; shake</span><i aria-hidden="true"></i></button>
  <button class="link" id="chg">Change passcode</button>
  <button class="link" id="fb">⭐ Rate &amp; feedback</button>
  <p class="hint" style="margin-top:12px;font-size:15px" id="visits" hidden></p>
  <p class="hint" style="margin-top:4px;font-size:13px" id="ver">Version ${APP_VERSION}</p>`;
  checkVersion();showVisits();
  scrim.classList.add('open');
  const ci=$('#ci'),fi=$('#fi');
  const val=()=>Math.max(0,parseInt(ci.value)||0);
  sheet.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>ci.value=Math.max(0,val()+ +b.dataset.d));
  sheet.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>ci.value=b.dataset.s==='full'?Math.max(1,parseInt(fi.value)||100):0);
  sheet.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
    pick=pick===b.dataset.e?'':b.dataset.e; // tap again to clear
    sheet.querySelectorAll('[data-e]').forEach(x=>x.classList.toggle('on',x.dataset.e===pick));
  });
  $('#cancel').onclick=close;
  $('#chg').onclick=()=>openPin('change1');
  $('#fb').onclick=openFeedback;
  const snd=$('#snd'),sndLabel=()=>{snd.classList.toggle('on',soundOn);snd.setAttribute('aria-checked',soundOn)};
  sndLabel();snd.onclick=()=>{soundOn=!soundOn;store.set('cj_sound',soundOn);sndLabel();clink()};
  // iPhone asks for motion access every time the app is opened (Apple doesn't let sites keep it); this turns it off
  const tlt=$('#tlt'),tltLabel=()=>{tlt.classList.toggle('on',tiltOn);tlt.setAttribute('aria-checked',tiltOn)};
  tltLabel();tlt.onclick=()=>{tiltOn=!tiltOn;store.set('cj_tilt',tiltOn);tltLabel();jar?.tilt(tiltOn)};
  $('#save').onclick=()=>{
    const before=state.full>0?state.coins/state.full*100:0,sameJar=Math.max(1,parseInt(fi.value)||100)===state.full;
    state.coins=val();state.full=Math.max(1,parseInt(fi.value)||100);
    label={e:pick,t:$('#gi').value.trim().slice(0,30)};
    store.set('cj_coins',state.coins);store.set('cj_full',state.full);store.set('cj_label',label);
    close();
    render();
    if(sameJar)milestone(before,state.coins/state.full*100);
  };
}
render();
// offline support: after the first visit the app opens with no internet (see sw.js)
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>


<script type="module">
// ---- the 3D jar: three.js draws it, Rapier simulates every coin ----
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

try{
await RAPIER.init();

// jar dimensions (world units): inner radius R, coins live between the floor (y=0) and the shoulder (y=TOP)
const R=1,TOP=2.4,NECK=.8,G=22;
const canvas=$('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
const sun=new THREE.DirectionalLight(0xfff1d6,1.6);sun.position.set(3,6,5);scene.add(sun);
// film lighting for the deposit scene: the key light casts soft shadows onto the table, and a cool rim light fades in
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-6,right:6,top:7,bottom:-4,near:1,far:25});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;sun.target.position.set(1.5,1,0);scene.add(sun.target);
const rimLight=new THREE.DirectionalLight(0xa8d4ff,0);rimLight.position.set(-5,6,-6);scene.add(rimLight);
const catcher=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:.3}));
catcher.rotation.x=-Math.PI/2;catcher.position.y=-.068;catcher.receiveShadow=true;scene.add(catcher);
const camera=new THREE.PerspectiveCamera(30,1,.1,100);

// background: the same soft gradient as the page, drawn inside WebGL so the glass can refract it
function paintBackground(){
  const css=getComputedStyle(document.documentElement),c=document.createElement('canvas');c.width=64;c.height=128;
  const g=c.getContext('2d'),grad=g.createLinearGradient(0,0,0,128);
  grad.addColorStop(0,css.getPropertyValue('--top').trim());grad.addColorStop(.75,css.getPropertyValue('--sky').trim());
  g.fillStyle=grad;g.fillRect(0,0,64,128);

paintBackground();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{paintBackground();kick()});

// ---- glass jar, lid and a soft contact shadow ----
const jarGroup=new THREE.Group();scene.add(jarGroup);
const profile=[[0,-.07],[.86,-.07],[1.0,-.04],[1.06,.08],[1.06,2.42],[1.02,2.6],[.9,2.74],[.84,2.8],[.84,2.97]].map(([x,y])=>new THREE.Vector2(x,y));
const glass=new THREE.Mesh(new THREE.LatheGeometry(profile,96),new THREE.MeshPhysicalMaterial({
  color:0xffffff,metalness:0,roughness:.04,transmission:1,thickness:.08,ior:1.5,
  specularIntensity:1,clearcoat:1,clearcoatRoughness:.03,envMapIntensity:1.4,side:THREE.DoubleSide}));
glass.renderOrder=2;jarGroup.add(glass);
const rimGeo=new THREE.TorusGeometry(.84,.035,12,64);rimGeo.rotateX(Math.PI/2);
const rim=new THREE.Mesh(rimGeo,glass.material);rim.position.y=2.97;jarGroup.add(rim);
const lid=new THREE.Group(),lidAt=new THREE.Vector3(0,2.93,0);lid.position.copy(lidAt);jarGroup.add(lid);
const lidMat=new THREE.MeshPhysicalMaterial({color:0xC7362B,roughness:.4,clearcoat:.5,clearcoatRoughness:.25,envMapIntensity:.7});
const lidBody=new THREE.Mesh(new THREE.LatheGeometry([[0,0],[.9,0],[.93,.03],[.93,.3],[.9,.34],[0,.34]].map(([x,y])=>new THREE.Vector2(x,y)),64),lidMat);
lid.add(lidBody);
for(let i=0;i<48;i++){ // grip ridges around the lid
  const r=new THREE.Mesh(new THREE.BoxGeometry(.025,.24,.03),lidMat);const a=i/48*Math.PI*2;
  r.position.set(Math.cos(a)*.935,.17,Math.sin(a)*.935);r.rotation.y=-a;lid.add(r);
}
const shadowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,10,64,64,64);
  gr.addColorStop(0,'rgba(0,0,0,.35)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(3.4,3.4),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=-.08;jarGroup.add(shadow);

// ---- coin look: metallic gold with a raised rim, beaded ring and star, ridged edge ----
function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);if(repeat){t.wrapS=THREE.RepeatWrapping}t.anisotropy=4;return t;
}
function starPath(g,cx,cy,ro,ri){g.beginPath();for(let i=0;i<10;i++){const r=i%2?ri:ro,a=-Math.PI/2+i*Math.PI/5;g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}g.closePath()}
const faceBump=canvasTex(256,256,(g,w)=>{
  g.fillStyle='#777';g.fillRect(0,0,w,w);
  g.strokeStyle='#fff';g.lineWidth=20;g.beginPath();g.arc(128,128,114,0,7);g.stroke();
  g.fillStyle='#ddd';for(let i=0;i<48;i++){const a=i/48*Math.PI*2;g.beginPath();g.arc(128+Math.cos(a)*92,128+Math.sin(a)*92,3.2,0,7);g.fill()}
  starPath(g,128,132,62,26);g.fillStyle='#fff';g.fill();
});
const faceColor=canvasTex(256,256,(g,w)=>{ // darken the recesses a touch so the relief reads at small sizes
  g.fillStyle='#fff';g.fillRect(0,0,w,w);g.strokeStyle='#d8c08a';g.lineWidth=6;g.beginPath();g.arc(128,128,102,0,7);g.stroke();
  starPath(g,128,132,66,28);g.strokeStyle='#d8c08a';g.lineWidth=5;g.stroke();
});
faceColor.colorSpace=THREE.SRGBColorSpace;
const edgeBump=canvasTex(512,4,(g,w,h)=>{for(let x=0;x<w;x+=4){g.fillStyle=x%8?'#fff':'#333';g.fillRect(x,0,4,h)}},true);
const gold={color:0xE8AE45,metalness:1,roughness:.3,envMapIntensity:.85,emissive:0x5a3a08,emissiveIntensity:.45}; // glow keeps coins facing dark reflections from going brown
const coinMats=[new THREE.MeshStandardMaterial({...gold,bumpMap:edgeBump,bumpScale:1.5,roughness:.32}),
  new THREE.MeshStandardMaterial({...gold,map:faceColor,bumpMap:faceBump,bumpScale:2.2}),
  new THREE.MeshStandardMaterial({...gold,map:faceColor,bumpMap:faceBump,bumpScale:2.2})];
const TINTS=[0xffffff,0xfff0dc,0xfffbe8,0xffe9c8].map(c=>new THREE.Color(c));
let mesh=null,C={}; // C = current coin size for this jar

// coin size for a jar that's full at N: few coins are big and chunky, many are smaller and thin.
// Thickness is tuned so a full jar's worth fills to the shoulder once the coins tumble.
// Jars up to PHYS coins: every coin is a physics body. Bigger jars: the bottom of the pile is a packed, still mass of
// coins drawn on the GPU, and only the top PHYS coins are physics bodies, resting on an invisible floor at the top of
// that mass (real piles behave like this too: tilt or shake one and only the top layer moves).
const PHYS=300;
const hash=i=>{const x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
function hexSlots(r){ // where coins lie in one flat layer of the packed mass
  const out=[],s=2*r*1.04,lim=R-r-.01;
  for(let j=-20;j<=20;j++)for(let i=-20;i<=20;i++){const x=(i+(j&1)/2)*s,z=j*s*.866;if(Math.hypot(x,z)<=lim)out.push([x,z])}
  return out;
}
function sizeFor(N){
  if(N>PHYS){ // many coins: smaller (volume ~ 1/N) and thinner, packed in layers
    const r=.3*Math.cbrt(PHYS/N),slots=hexSlots(r),M=slots.length,dy=TOP*.88/Math.ceil(N/M);
    const h=Math.min(r*.45,.51*R*R*TOP*.9/(2*N*r*r)); // same packing rule as the physics coins at 300
    return {N,r,h,big:true,slots,M,dy};
  }
  const r=Math.max(.3,Math.min(.7,.98-.3*Math.log10(Math.max(N,1))));
  // how much of the jar the tumbled coins actually occupy, measured by pouring each jar size in the simulation
  const PACK=[[.7,.49],[1,.46],[1.5,.38],[1.7,.37],[2,.44],[2.3,.5],[2.48,.51]],x=Math.log10(Math.max(N,1));
  let pack=PACK[0][1];
  for(let i=1;i<PACK.length;i++){const [x0,y0]=PACK[i-1],[x1,y1]=PACK[i];if(x>=x0)pack=x>=x1?y1:y0+(y1-y0)*(x-x0)/(x1-x0)}
  const h=Math.min(r*.45,Math.max(.012,pack*R*R*TOP*.9/(2*N*r*r)));
  return {N,r,h}; // h = half thickness
}
let packedMesh=null,packedMats=null; // the still mass at the bottom of big jars
function buildMesh(){
  if(mesh){jarGroup.remove(mesh);mesh.geometry.dispose();mesh.dispose()}
  if(packedMesh){jarGroup.remove(packedMesh);packedMesh.dispose();packedMesh=null}
  const geo=new THREE.CylinderGeometry(C.r,C.r,C.h*2,C.big?(C.r<.15?18:28):40,1);
  mesh=new THREE.InstancedMesh(geo,coinMats,PHYS+200); // physics coins + coins flying out
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);mesh.count=0;mesh.frustumCulled=false;
  for(let i=0;i<PHYS+200;i++)mesh.setColorAt(i,TINTS[i%TINTS.length]);
  jarGroup.add(mesh);
  if(!C.big)return;
  packedMesh=new THREE.InstancedMesh(geo,coinMats,C.N);packedMesh.count=0;packedMesh.frustumCulled=false;
  for(let i=0;i<C.N;i++)packedMesh.setColorAt(i,TINTS[i%TINTS.length]);
  jarGroup.add(packedMesh);
  // every packed coin's place, worked out once: layer by layer, each layer turned and jittered, coins tilted so it reads as a pile
  packedMats=new Float32Array(C.N*16);const e=new THREE.Euler();
  for(let i=0;i<C.N;i++){
    const L=Math.floor(i/C.M),[sx,sz]=C.slots[i%C.M],a=hash(L*7.1)*6.283,c=Math.cos(a),sn=Math.sin(a);
    let x=sx*c-sz*sn+(hash(i*3.3)-.5)*.5*C.r,z=sx*sn+sz*c+(hash(i*4.4)-.5)*.5*C.r;
    const d=Math.hypot(x,z),lim=R-C.r-.01;if(d>lim){x*=lim/d;z*=lim/d}
    tmpP.set(x,(L+.5)*C.dy+(hash(i*5.7)-.5)*.3*C.dy,z);
    tmpQ.setFromEuler(e.set((hash(i*1.3)-.5)*.6,hash(i*2.9)*6.283,(hash(i*6.1)-.5)*.6));tmpS.set(1,1,1);
    tmpM.compose(tmpP,tmpQ,tmpS).toArray(packedMats,i*16);
  }
}

// ---- physics world: floor, walls, shoulder ring, neck and a lid "plug" that opens to let coins in and out ----
const world=new RAPIER.World({x:0,y:-G,z:0});world.timestep=1/60;
const events=new RAPIER.EventQueue(true);
const ground=world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
const q=a=>({x:0,y:Math.sin(a/2),z:0,w:Math.cos(a/2)});
function box(hx,hy,hz,x,y,z,a=0){return world.createCollider(RAPIER.ColliderDesc.cuboid(hx,hy,hz).setTranslation(x,y,z).setRotation(q(a)).setFriction(.25),ground)}
box(1.6,.2,1.6,0,-.2,0);
for(let i=0,n=24;i<n;i++){const a=i/n*Math.PI*2,d=R+.15;box(.15,TOP/2+.6,(d+.15)*Math.tan(Math.PI/n)+.02,Math.cos(a)*d,TOP/2+.3,Math.sin(a)*d,-a)}
for(let i=0,n=16;i<n;i++){const a=i/n*Math.PI*2;box(.3,.1,.32,Math.cos(a)*(NECK+.3),TOP+.1,Math.sin(a)*(NECK+.3),-a)}   // shoulder ring
for(let i=0,n=16;i<n;i++){const a=i/n*Math.PI*2,d=NECK+.1;box(.1,.5,(d+.1)*Math.tan(Math.PI/n)+.02,Math.cos(a)*d,TOP+.6,Math.sin(a)*d,-a)} // neck
const plug=world.createCollider(RAPIER.ColliderDesc.cylinder(.1,NECK+.05).setTranslation(0,TOP+.1,0).setFriction(.25),ground);

// ---- coins ----
let coins=[],flying=[],wanted=0,pending=0,lastSpawn=0,simTime=0;
const tmpM=new THREE.Matrix4(),tmpQ=new THREE.Quaternion(),tmpP=new THREE.Vector3(),tmpS=new THREE.Vector3(1,1,1);
function addBody(p,rot){
  const b=world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(p.x,p.y,p.z).setRotation(rot)
    .setLinearDamping(.15).setAngularDamping(.4).setCcdEnabled(C.h<.03));
  world.createCollider(RAPIER.ColliderDesc.cylinder(C.h,C.r).setFriction(.25).setRestitution(.18).setDensity(1)
    .setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS),b);
  coins.push(b);return b;
}
function randomRot(tilt){const e=new THREE.Euler((Math.random()-.5)*tilt,Math.random()*6.28,(Math.random()-.5)*tilt);const r=new THREE.Quaternion().setFromEuler(e);return {x:r.x,y:r.y,z:r.z,w:r.w}}
function spawn(){ // drop one coin in through the neck: from under his open case if he's pouring
  let x,z;const lim=Math.max(0,NECK-C.r-.08);
  if(officer&&officer.state==='pour'&&officer.caseOpen>.6){
    officer.bag.localToWorld(tmpV.set(0,.2,.05));const d=Math.hypot(tmpV.x,tmpV.z)||1,k=Math.min(1,lim/d);
    x=tmpV.x*k+(Math.random()-.5)*.12;z=tmpV.z*k+(Math.random()-.5)*.12;emitSpark(x,TOP+.8,z,.2);
  }else{const a=Math.random()*6.28,d=Math.random()*Math.max(0,NECK-C.r*.6-.05);x=Math.cos(a)*d*.5;z=Math.sin(a)*d*.5}
  addBody({x,y:TOP+.75,z},randomRot(1.2)).setLinvel({x:0,y:-3,z:0},true);
}
function upAxis(){const g=world.gravity,m=Math.hypot(g.x,g.y,g.z)||1;return new THREE.Vector3(-g.x/m,-g.y/m,-g.z/m)}
function takeOut(n){ // the coins nearest the top (against gravity) float up out of the jar
  const up=upAxis();
  coins.sort((a,b)=>{const pa=a.translation(),pb=b.translation();return (pb.x*up.x+pb.y*up.y+pb.z*up.z)-(pa.x*up.x+pa.y*up.y+pa.z*up.z)});
  coins.splice(0,n).forEach((b,i)=>{
    const p=b.translation(),r=b.rotation();
    flying.push({from:new THREE.Vector3(p.x,p.y,p.z),rot:new THREE.Quaternion(r.x,r.y,r.z,r.w),t:-i*Math.min(.09,1.6/n),spin:(Math.random()-.5)*8});
    world.removeRigidBody(b);
  });
  coins.forEach(b=>b.wakeUp());
}

// ---- the packed mass (big jars only) ----
let packed=0,packedShown=0,packedFloor=null,packedDrawn=-1; // packed: how many coins it holds; packedShown: animating toward it
const packedTop=n=>C.big?n/C.M*C.dy:0;
function drawPacked(n){ // only coins that can be seen: against the glass, or in the top few layers
  if(!packedMesh)return;n=Math.round(n);if(n===packedDrawn)return;packedDrawn=n;
  const topL=Math.floor((n-1)/C.M),edge=R-C.r*3.2;let j=0;
  for(let i=0;i<n;i++){
    const o=i*16;
    if(Math.floor(i/C.M)>=topL-2||Math.hypot(packedMats[o+12],packedMats[o+14])>edge){tmpM.fromArray(packedMats,o);packedMesh.setMatrixAt(j++,tmpM)}
  }
  packedMesh.count=j;packedMesh.instanceMatrix.needsUpdate=true;
}
function setFloor(n){ // the physics coins rest on the top of the packed mass
  if(packedFloor){world.removeCollider(packedFloor,false);packedFloor=null}
  const top=packedTop(n);
  if(top>.001)packedFloor=world.createCollider(RAPIER.ColliderDesc.cylinder(top/2,R-.02).setTranslation(0,top/2,0).setFriction(.3),ground);
  coins.forEach(b=>b.wakeUp());
}
function setPacked(n){packed=packedShown=n;drawPacked(n);setFloor(n)}
function freeze(k){ // the lowest physics coins become part of the packed mass
  const up=upAxis();
  coins.sort((a,b)=>{const pa=a.translation(),pb=b.translation();return (pa.x*up.x+pa.y*up.y+pa.z*up.z)-(pb.x*up.x+pb.y*up.y+pb.z*up.z)});
  coins.splice(0,k).forEach(b=>world.removeRigidBody(b));
  setPacked(packed+k);
}
function thaw(k){ // the top of the packed mass becomes physics coins again (so there's always a layer to tilt)
  k=Math.min(k,packed);if(!k)return;
  const top=packedTop(packed-k);setPacked(packed-k);
  for(let i=0;i<k;i++){const [x,z]=C.slots[i%C.M];addBody({x,y:top+C.h*2+Math.floor(i/C.M)*C.h*3,z},randomRot(.3))}
}
function rebalance(){ // when the jar is still: keep about PHYS coins moving, the rest packed
  if(!C.big)return false;
  if(coins.length>PHYS){freeze(coins.length-PHYS);return true}
  if(coins.length<100&&packed>0){thaw(Math.min(packed,180-coins.length));return true}
  return false;
}

// ---- keep the pile between visits: save where every coin lies once they're all still ----
let saveTimer=0;
function savePile(){
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>{
    const d=[];coins.forEach(b=>{const p=b.translation(),r=b.rotation();d.push(...[p.x,p.y,p.z,r.x,r.y,r.z,r.w].map(v=>+v.toFixed(4)))});
    store.set('cj_pile',{N:C.N,packed,d});
  },400);
}
function restorePile(){
  const s=store.get('cj_pile',null);if(!s||s.N!==C.N)return;
  if(C.big)setPacked(Math.min(s.packed||0,wanted));
  for(let i=0;i+6<s.d.length&&coins.length+packed<wanted;i+=7){const d=s.d;addBody({x:d[i],y:d[i+1],z:d[i+2]},{x:d[i+3],y:d[i+4],z:d[i+5],w:d[i+6]})}
}

// ---- lid: opens while coins go in or out ----
let lidOpen=0,lidTarget=0,lidPop=0,wiggle=0,party=null,partyPop=false,capOpenT=0;const lidSquash={x:0,v:0}; // party: celebration waiting for the lid to close

// ---- the deposit film ----
// He walks in carrying a leather briefcase while the camera pulls back so the jar looks small; the camera then moves in

let askedTilt=false;
function askForTilt(){ // iPhone only lets a page read motion after a tap, and asks again each time the app is opened
  if(!mustAsk||!tiltOn||askedTilt)return;askedTilt=true;
  DeviceOrientationEvent.requestPermission().then(r=>{if(r!=='granted')askedTilt=false}).catch(()=>{askedTilt=false});
  if(typeof DeviceMotionEvent.requestPermission==='function')DeviceMotionEvent.requestPermission().catch(()=>{});
}

// ---- shake / tap: toss the coins against gravity ----
function jolt(s=1){
  if(coins.length){jingle(s>1.1);buzz(s>1.1?[18,40,18,40,18]:[15,30,15])}
  const up=upAxis();
  coins.forEach(b=>{const m=b.mass(),k=(2+Math.random()*4)*s;
    b.applyImpulse({x:(up.x*k+(Math.random()-.5)*3*s)*m,y:(up.y*k+(Math.random()-.5)*3*s)*m,z:(up.z*k+(Math.random()-.5)*3*s)*m},true);
    b.applyTorqueImpulse({x:(Math.random()-.5)*m*.3,y:0,z:(Math.random()-.5)*m*.3},true)});
  kick();
}

// ---- touch: tap the jar to shake it, drag sideways to spin around it ----
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,last:e.clientX};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.last;drag.last=e.clientX;
  if(Math.abs(e.clientX-drag.x)>8||Math.abs(e.clientY-drag.y)>8)drag.moved=true;
  if(drag.moved){yaw-=dx*.008;yawVel=-dx*.008;applyGravity();kick()}
});
canvas.addEventListener('pointerup',()=>{
  if(drag&&!drag.moved&&performance.now()-drag.t<400){askForTilt();wiggle=1;jolt(.8)}
  else yawVel*=.9;
  drag=null;kick();
});

// ---- camera: fit the jar into the space under the count, whatever the screen shape ----
function fit(){
  const W=canvas.clientWidth,H=canvas.clientHeight;if(!W||!H)return;
  renderer.setSize(W,H,false);camera.aspect=W/H;
  const top=$('#top').getBoundingClientRect().bottom+12,bottom=$('#bottom').getBoundingClientRect().top-8; // between the count and the pay bar
  const avail=Math.max(120,bottom-top),t=Math.tan(camera.fov*Math.PI/360);
  const dist=Math.max(3.9/(2*t)*(H/avail),2.7/(2*t*camera.aspect)/.9);
  camera.userData.dist=dist;
  camera.setViewOffset(W,H,0,H/2-(top+avail/2),W,H); // centre the jar in that space
  camera.updateProjectionMatrix();if(composer){composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(W,H)}kick();
}
new ResizeObserver(fit).observe(canvas);document.fonts?.ready.then(fit);addEventListener('orientationchange',()=>setTimeout(fit,300));

// ---- the film's camera: shots it eases between while the officer is on screen ----
// d: distance (x the normal framing; above 1 the jar looks smaller), tx/ty: where it looks, yaw/pitch: angle
const SHOTS={
  normal:  {d:1,   tx:0,  ty:0,   yaw:0,  pitch:.3},
  wide:    {d:2.2, tx:1.7,ty:1.15,yaw:.22,pitch:.2},  // he walks in; the jar shrinks to make room
  approach:{d:1.5, tx:.95,ty:.85, yaw:.3, pitch:.24},
  close:   {d:.8,  tx:.25,ty:1.5, yaw:.42,pitch:.42}, // the cap comes off and the coins cascade
  wave:    {d:1.5, tx:.95,ty:.85, yaw:.16,pitch:.22},
};
const cam={...SHOTS.normal};
function shotNow(){
  const o=officer;if(!o||o.state==='off')return SHOTS.normal;
  if(o.state==='enter')return o.grp.position.x>3.4?SHOTS.wide:SHOTS.approach;
  if(o.state==='pour')return o.t>.25?SHOTS.close:SHOTS.approach;
  return o.state==='wave'?SHOTS.wave:SHOTS.normal; // as he walks away the camera glides back to the jar
}
// bloom (the glow on the gold and sparkles) only while the film plays: it costs a little GPU time
let composer=null,bloom=null,bokeh=null,cine=0;
function renderFrame(){
  if(cine<.01)return renderer.render(scene,camera);
  if(!composer){
    composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
    bokeh=new BokehPass(scene,camera,{focus:8,aperture:.0004,maxblur:.0035});composer.addPass(bokeh); // film-camera depth of field
    bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.4,.4,2.0); // only the brightest glints and the sparkles glow
    composer.addPass(bloom);composer.addPass(new OutputPass());
    composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(canvas.clientWidth,canvas.clientHeight);
  }
  bloom.strength=.4*cine;
  // focus on what matters in the shot: the jar mouth during the pour, otherwise him
  const o=officer,subj=o&&o.state==='pour'?JAR_MOUTH:o?_r.copy(o.grp.position).setY(2.6):JAR_MOUTH;
  bokeh.uniforms.focus.value=camera.position.distanceTo(subj);bokeh.uniforms.aperture.value=.0004*cine; // gentle: background softens, the subject stays crisp
  composer.render();
}

// ---- main loop: runs only while something moves, so an idle jar uses no battery ----
let raf=0,last=0,acc=0,calmT=0,calmWins=0,calmSnap=null,lidTicks=0;
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
function step(){
  simTime+=1/60;
  if(pending>0&&lidOpen>=1&&capOpenT>.3&&!hold&&simTime-lastSpawn>Math.max(.025,Math.min(.12,1.4/pending))){
    const clear=!coins.some(b=>b.translation().y>TOP+.25);if(clear||pending>40){spawn();pending--;lastSpawn=simTime}
  }
  plug.setEnabled(lidOpen<.5);
  world.step(events);
  events.drainCollisionEvents((h1,h2,started)=>{
    if(!started)return;const b1=world.getCollider(h1).parent(),b2=world.getCollider(h2).parent();
    const v1=b1.linvel(),v2=b2.linvel(),s=Math.hypot(v1.x-v2.x,v1.y-v2.y,v1.z-v2.z);
    if(s>1.2)clink(Math.min(1,.2+s/8),b1.isFixed()||b2.isFixed());
    if(s>5)buzz(8); // a hard hit
  });
}
function frame(now){
  const dt=Math.max(0,Math.min(now-last,100))/1000;last=Math.max(last,now);
  const officerOn=!!(officer&&officer.state!=='off');
  // slow motion while the coins cascade from his case
  const slow=officerOn&&officer.state==='pour'&&!hold&&pending>0&&(officer.pourT||0)<1.4?.45:1; // just the first beat of the cascadetimeScale+=(slow-timeScale)*Math.min(1,dt*3);
  acc+=dt*timeScale;
  const busy=pending>0||flying.length>0||coins.some(b=>b.translation().y>TOP+.02); // coins still in the neck
  lidTarget=officerOn?(officer.capWant?1:0):(busy&&!hold?1:0); // with the officer, the cap waits for his knock
  officerUpdate(dt*timeScale);sparkUpdate(dt*timeScale);
  if(packedShown!==packed&&!hold){ // the packed level rises or falls smoothly
    const diff=packed-packedShown,stepN=Math.max(C.M*4,Math.abs(diff)/1.5)*dt;
    packedShown=Math.abs(diff)<=stepN?packed:packedShown+Math.sign(diff)*stepN;
    if(Math.round(packedShown)!==packedDrawn){drawPacked(packedShown);setFloor(packedShown)}
  }
  const shot=shotNow();for(const k in cam)cam[k]+=(shot[k]-cam[k])*Math.min(1,dt*1.5); // the camera glides between shots
  cine+=((officerOn?1:0)-cine)*Math.min(1,dt*2);rimLight.intensity=.9*cine;
  if(document.body.classList.contains('cinema')!==officerOn)document.body.classList.toggle('cinema',officerOn);
  // the lid: unscrews (slowly enough to see during the film), lifts off and is set down on the left
  const lidRate=officerOn?.7:2.6,lidWas=lidOpen;lidOpen+=Math.sign(lidTarget-lidOpen)*Math.min(Math.abs(lidTarget-lidOpen),lidRate*dt);
  if(lidOpen>=1&&lidWas<1)lidSquash.v=2.8;                             // lands on its edge with a squash
  if(lidOpen<=0&&lidWas>0){lidSquash.v=2;jarBounce.v=-1.2}             // screwed back on: a little settle
  capOpenT=lidOpen>=1?capOpenT+dt:0;
  if(party&&!busy&&!hold&&lidOpen<.03){const p=party;party=null;if(partyPop){lidPop=1;setTimeout(()=>{jolt(1.4);p()},280)}else p()} // full: pop the lid, toss the coins
  while(acc>=1/60){step();acc-=1/60}
  // swipe inertia
  if(!drag&&Math.abs(yawVel)>.0005){yaw+=yawVel;yawVel*=.92;applyGravity()}
  const d=(camera.userData.dist||8)*cam.d,ty=1.45+cam.ty,cy=yaw+cam.yaw;
  camera.position.set(cam.tx+Math.sin(cy)*Math.cos(cam.pitch)*d,ty+Math.sin(cam.pitch)*d,Math.cos(cy)*Math.cos(cam.pitch)*d);camera.lookAt(cam.tx,ty,0);
  // lid: lifts and tips back when open; pops when the jar is full
  lidPop=Math.max(0,lidPop-dt*1.4);const pop=Math.sin(lidPop*Math.PI)*1.1;
  // opening: the lid lifts off and is stood on its edge beside the jar (there's no room above it on a phone)
  // first 35%: one and a half turns off the thread (ratchet ticks), then it's lifted away
  const u=Math.min(1,lidOpen/.35),m=Math.max(0,(lidOpen-.35)/.65),e=m*m*(3-2*m),arc=Math.sin(e*Math.PI)*.7;
  if(Math.floor(u*9)!==lidTicks){if(u>0&&u<1)ratchet();lidTicks=Math.floor(u*9)}
  // stood on edge its centre sits .87 up (radius .93 minus the table at -.07), touching the glass at the back left
  lid.position.set(-e*1.0,lidAt.y+u*.12+(.87-lidAt.y-.12)*e+arc+pop,-e*.35); // set down on the left (the officer stands on the right)
  lid.rotation.order='ZYX';lid.rotation.set(-pop*.8,-u*Math.PI*3,e*Math.PI/2);
  // squash & stretch along whichever way is "up" for it (its thickness when on the jar, its width when stood on edge)
  const q=spring(lidSquash,0,170,10,dt)*.12,v=1-q,h=1+q*.5;lid.scale.set(e>.5?v:h,e>.5?h:v,h);
  wiggle=Math.max(0,wiggle-dt*2.2);
  const lean=spring(jarLean,officerOn&&officer.state==='pour'&&lidOpen<.3?-.05:0,60,8,dt); // leans toward him, eager
  jarGroup.rotation.z=Math.sin(wiggle*18)*wiggle*.05+lean;
  const jb=spring(jarBounce,0,140,7,dt);jarGroup.scale.set(1-jb*.035,1+jb*.07,1-jb*.035); // squash & stretch, volume kept
  // coin instances: the settled pile, then any coins flying out
  let i=0;
  for(const b of coins){const p=b.translation(),r=b.rotation();tmpP.set(p.x,p.y,p.z);tmpQ.set(r.x,r.y,r.z,r.w);tmpS.set(1,1,1);mesh.setMatrixAt(i++,tmpM.compose(tmpP,tmpQ,tmpS))}
  flying=flying.filter(f=>(f.t+=dt/.9)<1);
  for(const f of flying){
    const t=Math.max(0,f.t),e=t*t*(3-2*t),up=TOP+1.8;
    if(f.t>0&&!f.sounded){f.sounded=true;whoosh()}
    tmpP.set(f.from.x*(1-e),f.from.y+(up-f.from.y)*e+Math.sin(e*Math.PI)*.4,f.from.z*(1-e));
    tmpQ.copy(f.rot).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),e*f.spin));
    const s=t<.75?1:1-(t-.75)/.25;tmpS.set(s,s,s);mesh.setMatrixAt(i++,tmpM.compose(tmpP,tmpQ,tmpS));
  }
  mesh.count=i;mesh.instanceMatrix.needsUpdate=true;
  // piles keep jittering a hair forever, so the engine never sleeps them: if no coin has moved visibly
  // (more than ~2 px) over two half-second windows in a row, put the whole pile to sleep ourselves
  if(!busy&&coins.length&&!coins[0].isSleeping()){
    calmT+=dt;
    if(calmT>=.5){
      calmT=0;const pos=coins.map(b=>{const p=b.translation();return [p.x,p.y,p.z]});
      if(calmSnap&&calmSnap.length===pos.length){let m=0;pos.forEach((p,k)=>{m=Math.max(m,Math.hypot(p[0]-calmSnap[k][0],p[1]-calmSnap[k][1],p[2]-calmSnap[k][2]))});calmWins=m<.02?calmWins+1:0}
      calmSnap=pos;
      if(calmWins>=2){coins.forEach(b=>b.sleep());calmWins=0;calmSnap=null}
    }
  }else{calmT=0;calmWins=0;calmSnap=null}
  renderFrame();
  const camMoving=Object.keys(cam).some(k=>Math.abs(cam[k]-shot[k])>.002)||cine>.01;
  const moving=coins.some(b=>!b.isSleeping())||busy||party||officerOn||packedShown!==packed||camMoving||sparksAlive||Math.abs(jarBounce.x)+Math.abs(jarBounce.v)+Math.abs(jarLean.x)+Math.abs(lidSquash.x)+Math.abs(lidSquash.v)>.002||drag||Math.abs(yawVel)>.0005||Math.abs(lidOpen-lidTarget)>.01||lidPop>0||wiggle>0;
  if(moving||rebalance())raf=requestAnimationFrame(frame);else{raf=0;savePile()}
}

C=sizeFor(Math.min(state.full,CAP));buildMesh();wanted=wantedCoins();restorePile();
fit();
setTimeout(loadOfficer,1200); // after the jar is up, so he never slows the first paint
// test handle: step the scene by hand (browsers throttle animation frames in background tabs)
window.__jar={world,THREE,SHOTS,officerObj:()=>officer,coins:()=>coins,officer:()=>officer&&{state:officer.state,x:+officer.grp.position.x.toFixed(2),hold,camD:+cam.d.toFixed(2),timeScale:+timeScale.toFixed(2),anims:Object.keys(officer.actions)},dbg:()=>({packed,packedShown,hold,yaw:+yaw.toFixed(2),lidOpen,lidTarget,pending,flying:flying.length,lidPop,raf}),tick:n=>{for(let k=0;k<n;k++)frame(last+1000/60)},C:()=>C,setDevG:v=>{devG.set(v.x,v.y,v.z);applyGravity()},jolt};
window.jarReady({update,celebrate(cb,full){party=cb;partyPop=full;kick()},
  tilt(on){if(!on){devG.set(0,-1,0);usingAccel=false;accelSign=0;world.gravity={x:0,y:-G,z:0};coins.forEach(b=>b.wakeUp());kick()}}}); // tilt switched off: gravity back to straight down
}catch(err){console.error(err);window.jarFailed()}
</script>
