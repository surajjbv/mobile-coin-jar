<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#95D3E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A4757" media="(prefers-color-scheme: dark)">
<title>Coin Jar</title>
<meta name="apple-mobile-web-app-title" content="Coin Jar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs">
<style>
:root{
  --sky:#BFE6F0; --sky2:#8FD0E0; --top:#95D3E2; --ink:#173848; --gold:#F7C21A; --gold-dk:#C98A0E;
  --red:#D22F2F; --amber:#B86E00; --green:#23823A; --sheet:#FFFFFF; --muted:#5B7682;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky:#0F2E3A;--sky2:#1B4A5B;--top:#1A4757;--ink:#EAF6FA;--sheet:#17394A;--muted:#A6C3CE;--red:#FF6B6B;--amber:#FFB938;--green:#5FD37A}
}
:root[data-theme="dark"]{--sky:#0F2E3A;--sky2:#1B4A5B;--top:#1A4757;--ink:#EAF6FA;--sheet:#17394A;--muted:#A6C3CE;--red:#FF6B6B;--amber:#FFB938;--green:#5FD37A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* edge to edge: the page paints under the status bar, notch and home indicator; content keeps clear via safe-area insets */
/* iOS 26 Safari ignores theme-color and tints its bars from the page's base background colour, so that must be the top colour */
html{background:var(--top);height:100%}
body{margin:0;min-height:100lvh;background:var(--top) linear-gradient(180deg,var(--top),var(--sky) 75%) fixed;color:var(--ink);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;touch-action:none;
  -webkit-user-select:none;user-select:none;overflow:hidden;overscroll-behavior:none}
/* Safari tints its top bar from what touches the top edge: match the gradient's lightest (top) colour, not the page's darker base */
#tint{position:fixed;left:0;top:0;width:100vw;height:max(2px,env(safe-area-inset-top));background:var(--top);pointer-events:none;z-index:2}
#scene{position:fixed;left:0;top:0;width:100vw;height:100lvh;display:block;cursor:grab}
#fx{position:fixed;left:0;top:0;width:100vw;height:100lvh;pointer-events:none;z-index:3}
main{position:fixed;left:0;top:0;width:100vw;height:100dvh;pointer-events:none;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  padding:max(14px,calc(env(safe-area-inset-top) + 6px)) 16px max(14px,calc(env(safe-area-inset-bottom) + 6px))}
#top{display:flex;flex-direction:column;align-items:center}
#count{pointer-events:auto;background:none;border:0;color:var(--ink);font:inherit;font-weight:800;
  font-size:clamp(56px,17vw,88px);line-height:.9;letter-spacing:-.02em;cursor:pointer;
  display:flex;align-items:center;gap:.12em;padding:4px 8px}
#count.red{color:var(--red)}#count.amber{color:var(--amber)}#count.green{color:var(--green)}
#count .c{width:.7em;height:.7em;flex:none;filter:drop-shadow(0 .03em .02em rgba(0,0,0,.25))}
#count.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.12)}}
.sub{font-size:18px;font-weight:600;color:var(--muted)}
#label{margin-top:6px;padding:4px 14px;border-radius:999px;background:color-mix(in srgb,var(--sheet) 55%,transparent);
  font-size:18px;font-weight:700;max-width:88vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{margin:auto;font-size:18px;font-weight:600;color:var(--muted);text-align:center;max-width:320px}
#bottom{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
#hint{font-size:16px;font-weight:600;color:var(--muted)}
/* pay bar: open to everyone; adding asks for a grown-up */
#bar{pointer-events:auto;width:100%;max-width:440px;display:flex;gap:8px;align-items:center;padding:6px;border-radius:24px;
  background:color-mix(in srgb,var(--sheet) 70%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#bar input{flex:1;min-width:0;height:52px;border-radius:18px;border:2px solid var(--sky2);background:var(--sheet);color:var(--ink);
  font:inherit;font-size:24px;font-weight:700;text-align:center}
#bar button{height:52px;border:0;border-radius:18px;padding:0 16px;font:inherit;font-size:20px;font-weight:800;color:#fff;white-space:nowrap}
#pay{background:#D8443A}#add{background:#23823A}
#bar.shake{animation:shake .35s}
.float{position:fixed;z-index:4;pointer-events:none;font-weight:800;font-size:44px;animation:floatUp 1.5s ease-out forwards}
.float.out{color:var(--red)}.float.in{color:var(--green)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0) scale(1.1)}to{opacity:0;transform:translate(-50%,-80px) scale(.9)}}
@media (prefers-reduced-motion:reduce){#count.bump{animation:none}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,30,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.scrim.open{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:440px;border-radius:28px 28px 0 0;max-height:92dvh;overflow-y:auto;
  padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease;touch-action:pan-y}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{margin:0;text-align:center;font-size:24px}
.sheet p.hint{margin:2px 0 14px;text-align:center;color:var(--muted);font-size:16px;min-height:24px}
.sheet p.err{color:#D8443A}
.dots{display:flex;justify-content:center;gap:16px;margin:6px 0 18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--gold);border-color:var(--gold-dk)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:18px;border:0;background:var(--sky);color:var(--ink);font:inherit;font-size:28px;font-weight:700}
.pad button:active{transform:scale(.95)}
.pad button:disabled{opacity:.35}
.pad button.ghost{background:none;font-size:18px;color:var(--muted)}
label{display:block;font-size:16px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0;height:56px;border-radius:16px;border:2px solid var(--sky2);background:transparent;color:var(--ink);
  font:inherit;font-size:26px;font-weight:700;text-align:center}
.row input#gi{font-size:20px;font-weight:600}
.row button{height:56px;min-width:64px;border-radius:16px;border:0;background:var(--sky);color:var(--ink);font:inherit;font-size:20px;font-weight:700}
.quick{display:flex;gap:8px;margin-top:8px}
.quick button{flex:1;height:40px;border-radius:12px;border:0;background:var(--sky);color:var(--ink);font:inherit;font-size:16px;font-weight:600}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.emojis button{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--sky);font-size:22px}
.emojis button.on{border-color:var(--gold-dk);background:var(--gold)}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1;height:56px;border-radius:18px;border:0;font:inherit;font-size:20px;font-weight:700}
.primary{background:var(--gold);color:#3A2600}
.secondary{background:var(--sky);color:var(--ink)}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:16px;text-decoration:underline}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="tint" aria-hidden="true"></div>
<canvas id="scene" aria-label="A glass jar of gold coins. Tap to shake it, drag to spin it."></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <div id="top">
    <button id="count" aria-label="Coin count. Triple-tap to edit"><svg class="c" viewBox="-20 -20 40 40" aria-hidden="true">
      <defs>
        <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6C4"/><stop offset=".3" stop-color="#FFD84D"/><stop offset=".6" stop-color="#F3B41F"/><stop offset=".85" stop-color="#D4930F"/><stop offset="1" stop-color="#FFE27A"/></linearGradient>
        <path id="star" d="M0,-7L1.7,-2.35L6.66,-2.16L2.76,.9L4.11,5.66L0,2.9L-4.11,5.66L-2.76,.9L-6.66,-2.16L-1.7,-2.35Z"/>
      </defs>
      <circle r="19.5" fill="#A8700A"/><circle r="18" fill="url(#gA)"/>
      <circle r="15" fill="none" stroke="#B8800C" stroke-width="1.6"/><circle r="15" cy=".8" fill="none" stroke="#FFF1B8" stroke-width=".9" opacity=".8"/>
      <use href="#star" transform="translate(0 1) scale(1.35)" fill="#A8700A" opacity=".55"/><use href="#star" transform="scale(1.35)" fill="#FFE27A"/>
      <ellipse cx="-8" cy="-9" rx="5" ry="2.2" transform="rotate(-35 -8 -9)" fill="#fff" opacity=".7"/></svg><span id="num">0</span></button>
    <div class="sub" id="sub">gold coins</div>
    <div id="label" hidden></div>
  </div>
  <div id="status">Filling the jar…</div>
  <div id="bottom">
    <div id="hint" hidden>Tap the jar, then tilt your phone! 📱</div>
    <form id="bar" autocomplete="off">
      <input id="amt" type="number" inputmode="numeric" min="1" placeholder="Amount" aria-label="Amount to pay">
      <button id="pay" type="submit">Pay 💸</button>
      <button id="add" type="button" aria-label="Add coins (grown-ups only)">＋ Add</button>
    </form>
  </div>
</main>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
// ---- app state, sounds, confetti and the grown-ups sheet (plain script: works even if the 3D jar can't load) ----
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let state={coins:store.get('cj_coins',10),full:store.get('cj_full',100)};
let pin=store.get('cj_pin',null);
let label=store.get('cj_label',{e:'',t:''});
const CAP=10000; // most coins drawn (they get smaller as the jar holds more); above this each coin shown stands for more than one
let jar=null;  // the 3D jar, once its module has loaded
const APP_VERSION='2026.10.01-3'; // shown in the grown-ups menu, to check a phone has the latest

function wantedCoins(){
  return state.full<=CAP?Math.min(state.coins,state.full)
    :(state.coins>0?Math.max(1,Math.round(Math.min(state.coins/state.full,1)*CAP)):0);
}
function render(){
  if(jar)jar.update(wantedCoins(),Math.min(state.full,CAP));
  $('#num').textContent=state.coins.toLocaleString();
  const pct=state.full>0?state.coins/state.full*100:0;
  const c=$('#count');c.classList.remove('red','amber','green');
  c.classList.add(pct>=80?'green':pct<=20?'red':'amber');
  $('#sub').textContent=state.coins===0?'the jar is empty':state.coins>=state.full?'the jar is full!':state.coins===1?'gold coin':'gold coins';
  const l=$('#label'),txt=`${label.e} ${label.t}`.trim();l.textContent=txt;l.hidden=!txt;
  c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');
}
window.jarReady=j=>{jar=j;$('#status').hidden=true;render()};
window.jarFailed=()=>{$('#status').textContent='Couldn’t load the 3D jar. Check the internet connection and reopen the app.'};

// ---- sound: real coin recordings (CC0, sounds/), with a synthesised fallback until they load ----
let actx=null,lastClink=0,soundOn=store.get('cj_sound',true),tiltOn=store.get('cj_tilt',true);
// Browsers only start audio from a tap. iOS also 'interrupts' it when the app goes to the background or a system
// pop-up (like the motion prompt) appears, and a context revived after that can stay silent. So on any tap, if the
// audio isn't running (or the app has been away), start a fresh audio engine; the decoded recordings are reused.
let audioStale=false;
function unlockAudio(){
  if(actx&&(audioStale||actx.state!=='running')){actx.close().catch(()=>{});actx=null;master=null}
  audioStale=false;
  if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;actx=new A();lastClink=0}
  if(actx.state!=='running')actx.resume().catch(()=>{});
  loadSamples();
}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('touchend',unlockAudio,{passive:true}); // iOS is most willing to start audio on touchend
document.addEventListener('visibilitychange',()=>{if(document.hidden)audioStale=true});
let master=null;
function out(){ // everything goes through a limiter so a big pour doesn't distort
  if(!master){master=actx.createDynamicsCompressor();master.threshold.value=-16;master.ratio.value=6;master.connect(actx.destination)}
  return master;
}
function tone(t,freq,amp,decay,type='sine',glideTo){
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t+decay);
  o.connect(g);g.connect(out());
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+decay);
  o.start(t);o.stop(t+decay+.02);
}
const audible=()=>soundOn&&actx&&actx.state==='running';
// A struck coin rings at a free metal disc's mode frequencies (inharmonic ratios below). Each mode is really two
// slightly detuned modes, which beat against each other: that shimmer is what makes it sound like metal, not a beep.
// Higher modes die away faster; a short band-passed noise burst gives the "chk" of the strike itself.
const COIN_MODES=[[1,1,1],[1.73,.55,.7],[2.33,.5,.55],[3.91,.3,.4],[4.11,.26,.35],[6.3,.14,.22]]; // [ratio, level, decay]
let noiseBuf=null;
function coinStrike(ctx,dest,t,f,len,vol){
  if(!noiseBuf||noiseBuf.sampleRate!==ctx.sampleRate){
    noiseBuf=ctx.createBuffer(1,Math.round(ctx.sampleRate*.03),ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  const bus=ctx.createGain();bus.gain.value=vol;
  if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=(Math.random()-.5)*.7;bus.connect(p);p.connect(dest)}else bus.connect(dest);
  for(const [ratio,level,decay] of COIN_MODES){
    const fr=f*ratio;if(fr>16000)continue;
    for(const side of [-1,1]){
      const o=ctx.createOscillator(),g=ctx.createGain(),end=t+len*decay*(.85+Math.random()*.3);
      o.frequency.value=fr*(1+side*(.0015+Math.random()*.004));
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(level*.5,t+.0012);g.gain.exponentialRampToValueAtTime(.0001,end);
      o.connect(g);g.connect(bus);o.start(t);o.stop(end+.02);
    }
  }
  const n=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),ng=ctx.createGain();
  n.buffer=noiseBuf;bp.type='bandpass';bp.frequency.value=Math.min(12000,f*3);bp.Q.value=.9;
  ng.gain.setValueAtTime(1.4,t);ng.gain.exponentialRampToValueAtTime(.001,t+.014);
  n.connect(bp);bp.connect(ng);ng.connect(bus);n.start(t);n.stop(t+.03);
}
// recorded clinks: single coin-on-coin hits, harder hits that bounce, and handfuls of coins for a shake
const SAMPLES={clink:[1,2,3,4,5],bounce:[1,2,3,4],jingle:[1,2]};
let buffers=null;
async function loadSamples(){ // one at a time (clinks first), retrying once: gentle on a patchy phone connection
  if(buffers||!actx)return;buffers={clink:[],bounce:[],jingle:[]};
  for(const [kind,ids] of Object.entries(SAMPLES))for(const i of ids)for(let attempt=0;attempt<2;attempt++){
    try{
      const a=await (await fetch(`sounds/${kind}-${i}.m4a`)).arrayBuffer();
      buffers[kind].push(await new Promise((ok,no)=>actx.decodeAudioData(a,ok,no)));break;
    }catch(e){}
  }
}
function play(kind,vol,rate=1){
  const list=buffers&&buffers[kind];if(!list||!list.length)return false;
  const src=actx.createBufferSource(),g=actx.createGain();
  src.buffer=list[Math.floor(Math.random()*list.length)];
  src.playbackRate.value=rate*(.93+Math.random()*.14); // every coin a little different
  g.gain.value=vol;src.connect(g);
  if(actx.createStereoPanner){const p=actx.createStereoPanner();p.pan.value=(Math.random()-.5)*.6;g.connect(p);p.connect(out())}else g.connect(out());
  src.start();return true;
}
function clink(vol=1,glass=false){ // glass: a coin hitting the jar rather than another coin
  if(!audible())return;
  const t=actx.currentTime;if(t-lastClink<.035)return;lastClink=t; // many coins at once → a jingle, not a roar
  if(play(vol>.6?'bounce':'clink',.55*vol*(glass?.7:1),glass?.85:1))return;
  coinStrike(actx,out(),t,1900+Math.random()*1100,.6+Math.random()*.5,.35*vol); // recordings not loaded yet
}
function jingle(strong){if(audible())play('jingle',strong?.7:.5,1)}
// little vibrations on Android (iPhone doesn't let web pages vibrate); they follow the sound switch
let lastBuzz=0;
function buzz(pattern){
  if(!soundOn||!navigator.vibrate||!(navigator.userActivation?.hasBeenActive??true))return;
  const now=Date.now();if(now-lastBuzz<80)return;lastBuzz=now;navigator.vibrate(pattern);
}
function whoosh(){ // a coin leaving the jar
  if(!audible())return;const t=actx.currentTime;tone(t,900,.07,.22,'sine',260);
}
function fanfare(big){ // milestone: a rising arpeggio
  if(!audible())return;const t=actx.currentTime,notes=big?[523,659,784,1047,1319]:[659,784,1047];
  notes.forEach((f,i)=>{tone(t+i*.09,f,.09,.45,'triangle');tone(t+i*.09,f*2,.03,.3)});
}

// ---- confetti ----
const fx=$('#fx'),fxc=fx.getContext('2d');let bits=[],fxRaf=0;
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)n=Math.round(n/4);
  const W=fx.width=innerWidth*devicePixelRatio,H=fx.height=fx.clientHeight*devicePixelRatio,s=devicePixelRatio;
  const cols=['#F7C21A','#FFE27A','#E2574C','#5FD37A','#4FB3E8','#F58BD0'];
  for(let i=0;i<n;i++)bits.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*14*s,vy:(-10-Math.random()*14)*s,
    w:(6+Math.random()*6)*s,h:(10+Math.random()*8)*s,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1});
  if(!fxRaf)fxRaf=requestAnimationFrame(fxTick);
}
function fxTick(){
  const s=devicePixelRatio;fxc.clearRect(0,0,fx.width,fx.height);
  bits=bits.filter(b=>b.life>0&&b.y<fx.height+40);
  for(const b of bits){
    b.vy+=.45*s;b.vx*=.99;b.vy*=.99;b.x+=b.vx;b.y+=b.vy;b.a+=b.va;b.life-=.006;
    fxc.save();fxc.globalAlpha=Math.min(1,b.life*3);fxc.translate(b.x,b.y);fxc.rotate(b.a);fxc.scale(1,Math.cos(b.a*2));
    fxc.fillStyle=b.c;fxc.fillRect(-b.w/2,-b.h/2,b.w,b.h);fxc.restore();
  }
  fxRaf=bits.length?requestAnimationFrame(fxTick):0;
}
// celebrate when a save carries the jar past 25%, 50%, 75% or full
function milestone(before,after){
  const crossed=[25,50,75,100].filter(m=>before<m&&after>=m);
  if(!crossed.length)return;
  const full=crossed.includes(100);
  const party=()=>{confetti(full?260:90);fanfare(full);buzz(full?[40,60,40,60,120]:[30,50,30])};
  if(full&&jar)jar.celebrate(party);else setTimeout(party,500); // a full jar waits for the last coin and the lid
}

// ---- grown-up check: the 4-digit passcode on a shuffled keypad (a child can't copy where your finger goes) ----
// 3 wrong tries lock it for a minute; the lock survives closing the app.
let afterAuth=()=>openEdit(),lock=store.get('cj_lock',{n:0,until:0});
store.set('cj_bio',null); // Face ID was tried and removed: forget any saved passkey id
function requireGrownUp(next){afterAuth=next;openPin(pin?'enter':'set1')}

// ---- triple tap the number: all the grown-up settings ----
let taps=[];
$('#count').addEventListener('click',()=>{
  const now=Date.now();taps=taps.filter(t=>now-t<700);taps.push(now);
  if(taps.length>=3){taps=[];requireGrownUp(()=>openEdit())}
});

// ---- pay (anyone) and add (grown-ups) ----
const pctFull=()=>state.full>0?state.coins/state.full*100:0;
function floatText(txt,out){ // "−25" / "+10" drifting up from the count
  const r=$('#num').getBoundingClientRect(),f=document.createElement('div');
  f.className='float '+(out?'out':'in');f.textContent=txt;f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.bottom+4)+'px';
  document.body.appendChild(f);setTimeout(()=>f.remove(),1600);
}
function changeCoins(delta){
  const before=pctFull();
  state.coins=Math.max(0,state.coins+delta);store.set('cj_coins',state.coins);render();
  floatText((delta<0?'−':'+')+Math.abs(delta).toLocaleString(),delta<0);
  if(delta>0)milestone(before,pctFull());
}

const scrim=$('#scrim'),sheet=$('#sheet');
function close(){scrim.classList.remove('open')}

let entry='',firstPin='',mode='';
const copy={set1:['Create a passcode','Pick 4 digits only you know'],set2:['Confirm passcode','Enter the same 4 digits again'],
  enter:['Enter passcode','Grown-ups only'],change1:['New passcode','Pick 4 new digits'],change2:['Confirm new passcode','Enter the same 4 digits again']};
let lockTimer=0;
function openPin(m,err){
  mode=m;entry='';clearInterval(lockTimer);

  const d=[1,2,3,4,5,6,7,8,9,0];if(m==='enter')for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
  sheet.innerHTML=`<h2>${copy[m][0]}</h2><p class="hint ${err?'err':''}" id="pinmsg">${err||copy[m][1]}</p>
  <div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>
  <div class="pad">${d.slice(0,9).map(n=>`<button data-k="${n}">${n}</button>`).join('')}
  <button class="ghost" data-k="x">Cancel</button><button data-k="${d[9]}">${d[9]}</button><button class="ghost" data-k="b">Delete</button></div>`;
  scrim.classList.add('open');

}

  const msg=$('#pinmsg'),btns=sheet.querySelectorAll('.pad button:not([data-k="x"])');
  btns.forEach(b=>b.disabled=true);msg.classList.add('err');
  const tick=()=>{
    const left=Math.ceil((lock.until-Date.now())/1000);
    if(left<=0){clearInterval(lockTimer);btns.forEach(b=>b.disabled=false);msg.classList.remove('err');msg.textContent=copy.enter[1];return}
    msg.textContent=`Too many tries. Wait ${left}s`;
  };

  if(k==='x')return close();
  if(mode==='enter'&&lock.until>Date.now())return; // locked out after 3 wrong tries

  }
}

// ---- the packed mass (big jars only) ----

  const topL=Math.floor((n-1)/C.M),edge=R-C.r*3.2;let j=0;

}

// ---- keep the pile between visits: save where every coin lies once they're all still ----
let saveTimer=0;
function savePile(){

    const d=[];coins.forEach(b=>{const p=b.translation(),r=b.rotation();d.push(...[p.x,p.y,p.z,r.x,r.y,r.z,r.w].map(v=>+v.toFixed(4)))});

function restorePile(){

// ---- lid: opens while coins go in or out ----
let lidOpen=0,lidTarget=0,lidPop=0,wiggle=0,party=null; // party: celebration waiting for the lid to close

// ---- the officer: walks in with a briefcase and tips the new coins into the jar ----
// Model: "Business Man" by Quaternius (CC0), trimmed to its Idle/Walk/Interact/Wave animations (officer.glb).
// While he walks in, `hold` keeps the lid shut and the new coins waiting; they pour once his case is over the jar.
let officer=null,hold=false,zoom=1;
const OFF={height:4.2,startX:7.5,standX:1.6,z:.55,speed:2.6},tmpV=new THREE.Vector3();
function makeBriefcase(){
  const g=new THREE.Group(),leather=new THREE.MeshStandardMaterial({color:0x5a3417,roughness:.55}),
    brass=new THREE.MeshStandardMaterial({color:0xd8a742,metalness:1,roughness:.3});

  const handle=new THREE.Mesh(new THREE.TorusGeometry(.1,.028,8,16,Math.PI),leather);handle.position.y=.25;g.add(handle);
  for(const x of [-.23,.23]){const c=new THREE.Mesh(new THREE.BoxGeometry(.07,.06,.22),brass);c.position.set(x,.2,0);g.add(c)}

}
let officerLoading=null;
function loadOfficer(){ // resolves true once he's ready (or false if he can't load); safe to call more than once
  if(officerLoading)return officerLoading;
  return officerLoading=new Promise(ready=>new GLTFLoader().load('officer.glb',gltf=>{
    const root=gltf.scene;root.traverse(o=>{if(o.isMesh)o.frustumCulled=false});
    root.updateMatrixWorld(true);root.getObjectByName('Head_end').getWorldPosition(tmpV);root.scale.setScalar(OFF.height/tmpV.y);
    const grp=new THREE.Group(),sh=new THREE.Mesh(new THREE.PlaneGeometry(2,2),shadow.material);
    sh.rotation.x=-Math.PI/2;sh.position.y=-.075;grp.add(root,sh);grp.visible=false;scene.add(grp);
    const mixer=new THREE.AnimationMixer(root),actions={};
    for(const c of gltf.animations)actions[c.name]=mixer.clipAction(c);
    if(actions.Wave){actions.Wave.setLoop(THREE.LoopRepeat,2);actions.Wave.clampWhenFinished=true} // wave twice
    const bag=makeBriefcase();bag.visible=false;scene.add(bag);
    const bone=n=>root.getObjectByName(n.replace('.',''))||root.getObjectByName(n); // the loader drops the dot from bone names
    officer={grp,root,mixer,actions,bag,upper:bone('UpperArm.R'),lower:bone('LowerArm.R'),wrist:bone('Wrist.R'),
      state:'off',t:0,cur:null,pour:0};

  },undefined,err=>{console.warn('Officer could not load',err);officerLoading=null;ready(false)})); // no officer: coins just pour in
}
function act(name,fade=.25){
  const o=officer,a=o.actions[name];if(!a||o.cur===a)return;
  a.reset().fadeIn(fade).play();if(o.cur)o.cur.fadeOut(fade);o.cur=a;
}
function startOfficer(){
  if(!officer){ // tapped Add before he finished loading: keep the coins waiting for him (up to 6 s)
    hold=true;kick();
    const giveUp=setTimeout(()=>{hold=false;kick()},6000);
    loadOfficer().then(ok=>{clearTimeout(giveUp);if(ok&&hold)startOfficer();else{hold=false;kick()}});
    return;
  }
  if(officer.state!=='off')return; // already here: these coins join his pour
  const o=officer;o.state='enter';o.t=0;o.pour=0;o.grp.visible=o.bag.visible=true;

function officerUpdate(dt){
  const o=officer;if(!o||o.state==='off')return;
  o.t+=dt;o.mixer.update(dt);
  const turnTo=(to,k)=>{const d=Math.atan2(Math.sin(to-o.grp.rotation.y),Math.cos(to-o.grp.rotation.y));o.grp.rotation.y+=d*Math.min(1,dt*k)};
  if(o.state==='enter'){ // walk in from the right
    o.grp.position.x-=OFF.speed*dt;turnTo(-Math.PI/2,8);
    if(o.grp.position.x<=OFF.standX){o.grp.position.x=OFF.standX;o.state='pour';o.t=0;act('Idle')}
  }else if(o.state==='pour'){ // reach over the jar; the lid comes off and the coins fall from his case
    if(o.t>.6)hold=false;
    if(o.t>1.8&&!hold&&pending===0&&!coins.some(b=>b.translation().y>TOP+.02)){o.state='wave';o.t=0;act('Wave')}
  }else if(o.state==='wave'){ // turn to the child and wave
    turnTo(Math.atan2(camera.position.x-o.grp.position.x,camera.position.z-o.grp.position.z),5);
    if(o.t>(o.actions.Wave?o.actions.Wave.getClip().duration*2:2)+.3){o.state='leave';o.t=0;act('Walk')}
  }else if(o.state==='leave'){ // and off he goes

  }

  if(e>0)reachArm(o,POUR_AT,e);

  o.wrist.getWorldPosition(tmpV);
  o.bag.position.set(tmpV.x-.3*e,tmpV.y-.32+.27*e,tmpV.z);

const POUR_AT=new THREE.Vector3(.62,TOP+1.08,.12); // where his hand goes: just above and beside the jar mouth
const _s=new THREE.Vector3(),_e=new THREE.Vector3(),_n=new THREE.Vector3(),_p=new THREE.Vector3(),_d=new THREE.Vector3(),
  _qw=new THREE.Quaternion(),_qp=new THREE.Quaternion(),_qa=new THREE.Quaternion(),_y=new THREE.Vector3();
function aimBone(b,dir,blend){ // turn bone b (which points along its local +Y) so it points along dir, keeping its twist
  b.getWorldQuaternion(_qw);_y.set(0,1,0).applyQuaternion(_qw);

function reachArm(o,target,blend){

  const a=_s.distanceTo(_e),b=_e.distanceTo(_d);                  // upper and lower arm lengths

function update(n,N){
  if(window.officerNext){window.officerNext=false;if(C.N===N)startOfficer()} // a deposit: the officer brings it (even when it's too small to add a drawn coin)
  if(C.N!==N){ // a different jar size: start again with coins sized for it
    coins.forEach(b=>world.removeRigidBody(b));coins=[];flying=[];pending=0;C=sizeFor(N);buildMesh();setPacked(0);packedDrawn=-1;
    wanted=n;restorePile();
    if(C.big&&!coins.length&&!packed)setPacked(Math.max(0,n-PHYS)); // a fresh big jar: start packed, pour the top layer
  }
  wanted=n;
  const have=coins.length+pending+packed;

// ---- gravity follows the phone; tilting while held upright works (accelerometer, sign-calibrated) ----
let yaw=0,yawVel=0,devG=new THREE.Vector3(0,-1,0),accelSign=0,usingAccel=false,orientG=null;
function screenAngle(){return ((screen.orientation&&screen.orientation.angle)??window.orientation??0)*Math.PI/180}
function applyGravity(){
  const a=screenAngle(),x=devG.x*Math.cos(a)+devG.y*Math.sin(a),y=-devG.x*Math.sin(a)+devG.y*Math.cos(a),z=devG.z; // undo landscape rotation
  // device axes → world: screen-right, screen-up, out-of-screen (toward the viewer), following the camera's spin
  const gx=x*Math.cos(yaw)+z*Math.sin(yaw),gz=-x*Math.sin(yaw)+z*Math.cos(yaw),g=world.gravity;
  const nx=g.x*.6+gx*G*.4,ny=g.y*.6+y*G*.4,nz=g.z*.6+gz*G*.4; // smooth sensor jitter
  const moved=Math.hypot(nx-g.x,ny-g.y,nz-g.z)>.3;
  world.gravity={x:nx,y:ny,z:nz};if(moved){coins.forEach(b=>b.wakeUp());kick()}

let tiltWorked=store.get('cj_tilt_ok',false);
function sensed(){if(!tiltWorked){tiltWorked=true;store.set('cj_tilt_ok',true);$('#hint').hidden=true;fit()}}
addEventListener('deviceorientation',e=>{
  if(!tiltOn||e.beta==null||e.gamma==null)return;
  const r=Math.PI/180,b=e.beta*r,g=e.gamma*r;
  orientG=new THREE.Vector3(Math.sin(g)*Math.cos(b),-Math.sin(b),-Math.cos(b)*Math.cos(g)); // "down" in device axes
  if(!usingAccel){devG.copy(orientG);applyGravity()}sensed();
});
let lastShake=0;
addEventListener('devicemotion',e=>{
  if(!tiltOn)return;
  const a=e.accelerationIncludingGravity,now=Date.now();
  if(a&&a.x!=null){
    const v=new THREE.Vector3(-a.x,-a.y,-a.z).divideScalar(9.81); // per spec a device at rest reports the upward reaction
    if(!accelSign&&orientG&&v.length()>.5){accelSign=v.dot(orientG)<0?-1:1;usingAccel=true} // browsers disagree on the sign
    if(usingAccel){devG.copy(v.multiplyScalar(accelSign));applyGravity();sensed()}

    :a&&a.x!=null?Math.abs(Math.hypot(a.x,a.y,a.z)-9.81):0;
  if(m>14&&now-lastShake>300){lastShake=now;jolt(Math.min(1.6,m/14))}

const mustAsk=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
// the hint only shows until motion has worked once on this phone
if(tiltOn&&!store.get('cj_tilt_ok',false)){
  if(mustAsk)$('#hint').hidden=false;
  else if(navigator.maxTouchPoints>0&&'DeviceMotionEvent' in window){$('#hint').textContent='Tilt your phone! 📱';$('#hint').hidden=false}
}
let askedTilt=false;

  if(!mustAsk||!tiltOn||askedTilt)return;askedTilt=true;
  DeviceOrientationEvent.requestPermission().then(r=>{if(r!=='granted')askedTilt=false}).catch(()=>{askedTilt=false});
  if(typeof DeviceMotionEvent.requestPermission==='function')DeviceMotionEvent.requestPermission().catch(()=>{});

// ---- shake / tap: toss the coins against gravity ----
function jolt(s=1){
  if(coins.length){jingle(s>1.1);buzz(s>1.1?[18,40,18,40,18]:[15,30,15])}
  const up=upAxis();
  coins.forEach(b=>{const m=b.mass(),k=(2+Math.random()*4)*s;
    b.applyImpulse({x:(up.x*k+(Math.random()-.5)*3*s)*m,y:(up.y*k+(Math.random()-.5)*3*s)*m,z:(up.z*k+(Math.random()-.5)*3*s)*m},true);
    b.applyTorqueImpulse({x:(Math.random()-.5)*m*.3,y:0,z:(Math.random()-.5)*m*.3},true)});
  kick();

// ---- touch: tap the jar to shake it, drag sideways to spin around it ----
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,last:e.clientX};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.last;drag.last=e.clientX;
  if(Math.abs(e.clientX-drag.x)>8||Math.abs(e.clientY-drag.y)>8)drag.moved=true;
  if(drag.moved){yaw-=dx*.008;yawVel=-dx*.008;applyGravity();kick()}
});
canvas.addEventListener('pointerup',()=>{
  if(drag&&!drag.moved&&performance.now()-drag.t<400){askForTilt();wiggle=1;jolt(.8)}
  else yawVel*=.9;
  drag=null;kick();
});

// ---- camera: fit the jar into the space under the count, whatever the screen shape ----
function fit(){
  const W=canvas.clientWidth,H=canvas.clientHeight;if(!W||!H)return;
  renderer.setSize(W,H,false);camera.aspect=W/H;
  const top=$('#top').getBoundingClientRect().bottom+12,bottom=$('#bottom').getBoundingClientRect().top-8; // between the count and the pay bar
  const avail=Math.max(120,bottom-top),t=Math.tan(camera.fov*Math.PI/360);
  const dist=Math.max(3.9/(2*t)*(H/avail),2.7/(2*t*camera.aspect)/.9);
  camera.userData.dist=dist;
  camera.setViewOffset(W,H,0,H/2-(top+avail/2),W,H); // centre the jar in that space
  camera.updateProjectionMatrix();kick();
}
new ResizeObserver(fit).observe(canvas);document.fonts?.ready.then(fit);addEventListener('orientationchange',()=>setTimeout(fit,300));

// ---- main loop: runs only while something moves, so an idle jar uses no battery ----
let raf=0,last=0,acc=0,calmT=0,calmWins=0,calmSnap=null;
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
function step(){

  }

    const v1=b1.linvel(),v2=b2.linvel(),s=Math.hypot(v1.x-v2.x,v1.y-v2.y,v1.z-v2.z);

    const t=Math.max(0,f.t),e=t*t*(3-2*t),up=TOP+1.8;
    if(f.t>0&&!f.sounded){f.sounded=true;whoosh()}
    tmpP.set(f.from.x*(1-e),f.from.y+(up-f.from.y)*e+Math.sin(e*Math.PI)*.4,f.from.z*(1-e));
    tmpQ.copy(f.rot).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),e*f.spin));
    const s=t<.75?1:1-(t-.75)/.25;tmpS.set(s,s,s);mesh.setMatrixAt(i++,tmpM.compose(tmpP,tmpQ,tmpS));
  }
  mesh.count=i;mesh.instanceMatrix.needsUpdate=true;
  // piles keep jittering a hair forever, so the engine never sleeps them: if no coin has moved visibly
  // (more than ~2 px) over two half-second windows in a row, put the whole pile to sleep ourselves
  if(!busy&&coins.length&&!coins[0].isSleeping()){
    calmT+=dt;
    if(calmT>=.5){
      calmT=0;const pos=coins.map(b=>{const p=b.translation();return [p.x,p.y,p.z]});
      if(calmSnap&&calmSnap.length===pos.length){let m=0;pos.forEach((p,k)=>{m=Math.max(m,Math.hypot(p[0]-calmSnap[k][0],p[1]-calmSnap[k][1],p[2]-calmSnap[k][2]))});calmWins=m<.02?calmWins+1:0}
      calmSnap=pos;
      if(calmWins>=2){coins.forEach(b=>b.sleep());calmWins=0;calmSnap=null}
    }
  }else{calmT=0;calmWins=0;calmSnap=null}
  renderer.render(scene,camera);
  const moving=coins.some(b=>!b.isSleeping())||busy||party||officerOn||packedShown!==packed||Math.abs(zoom-zoomTo)>.002||drag||Math.abs(yawVel)>.0005||Math.abs(lidOpen-lidTarget)>.01||lidPop>0||wiggle>0;
  if(moving||rebalance())raf=requestAnimationFrame(frame);else{raf=0;savePile()}
}

C=sizeFor(Math.min(state.full,CAP));buildMesh();wanted=wantedCoins();restorePile();
fit();
setTimeout(loadOfficer,1200); // after the jar is up, so he never slows the first paint
// test handle: step the scene by hand (browsers throttle animation frames in background tabs)
window.__jar={world,THREE,officerObj:()=>officer,coins:()=>coins,officer:()=>officer&&{state:officer.state,x:+officer.grp.position.x.toFixed(2),hold,zoom:+zoom.toFixed(2),anims:Object.keys(officer.actions)},dbg:()=>({packed,packedShown,hold,yaw:+yaw.toFixed(2),lidOpen,lidTarget,pending,flying:flying.length,lidPop,raf}),tick:n=>{for(let k=0;k<n;k++)frame(last+1000/60)},C:()=>C,setDevG:v=>{devG.set(v.x,v.y,v.z);applyGravity()},jolt};
window.jarReady({update,celebrate(cb){party=cb;kick()},
  tilt(on){if(!on){devG.set(0,-1,0);usingAccel=false;accelSign=0;world.gravity={x:0,y:-G,z:0};coins.forEach(b=>b.wakeUp());kick()}}}); // tilt switched off: gravity back to straight down
}catch(err){console.error(err);window.jarFailed()}
</script>
