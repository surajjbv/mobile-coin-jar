<style>
:root{
  --sky:#BFE6F0; --sky2:#8FD0E0; --ink:#173848; --gold:#F7C21A; --gold-dk:#C98A0E;
  --gold-lt:#FFE68A; --glass:rgba(255,255,255,.35); --glass-edge:rgba(255,255,255,.85);
  --lid:#E2574C; --red:#D22F2F; --amber:#B86E00; --green:#23823A; --lid-dk:#B23A31; --sheet:#FFFFFF; --muted:#5B7682;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky:#0F2E3A;--sky2:#1B4A5B;--ink:#EAF6FA;--glass:rgba(255,255,255,.12);--glass-edge:rgba(255,255,255,.55);--sheet:#17394A;--muted:#A6C3CE;--red:#FF6B6B;--amber:#FFB938;--green:#5FD37A}
}
:root[data-theme="dark"]{--sky:#0F2E3A;--sky2:#1B4A5B;--ink:#EAF6FA;--glass:rgba(255,255,255,.12);--glass-edge:rgba(255,255,255,.55);--sheet:#17394A;--muted:#A6C3CE;--red:#FF6B6B;--amber:#FFB938;--green:#5FD37A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 10%,var(--sky2),var(--sky));color:var(--ink);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;overflow:hidden}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px}
#count{background:none;border:0;color:var(--ink);font:inherit;font-weight:800;
  font-size:clamp(56px,17vw,88px);line-height:.9;letter-spacing:-.02em;cursor:pointer;
  display:flex;align-items:center;gap:.12em}
#count.red{color:var(--red)}#count.amber{color:var(--amber)}#count.green{color:var(--green)}
#count .c{width:.7em;height:.7em;flex:none;filter:drop-shadow(0 .03em .02em rgba(0,0,0,.25))}
#count.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.12)}}
.sub{font-size:18px;font-weight:600;color:var(--muted);margin-bottom:8px}
svg#jar{width:min(94vw,480px);height:auto;max-height:76vh;overflow:visible;cursor:pointer;transform-origin:50% 95%}
svg#jar.wiggle{animation:wiggle .45s ease}
@keyframes wiggle{20%{transform:rotate(-3deg)}45%{transform:rotate(2.5deg)}70%{transform:rotate(-1.5deg)}}
@media (prefers-reduced-motion:reduce){#count.bump,svg#jar.wiggle{animation:none}}
#hint{font-size:16px;font-weight:600;color:var(--muted);margin-top:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,30,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.scrim.open{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:440px;border-radius:28px 28px 0 0;
  padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{margin:0;text-align:center;font-size:24px}
.sheet p.hint{margin:2px 0 14px;text-align:center;color:var(--muted);font-size:16px;min-height:24px}
.sheet p.err{color:#D8443A}
.dots{display:flex;justify-content:center;gap:16px;margin:6px 0 18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--gold);border-color:var(--gold-dk)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:18px;border:0;background:var(--sky);color:var(--ink);font:inherit;font-size:28px;font-weight:700}
.pad button:active{transform:scale(.95)}
.pad button.ghost{background:none;font-size:18px;color:var(--muted)}
label{display:block;font-size:16px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0;height:56px;border-radius:16px;border:2px solid var(--sky2);background:transparent;color:var(--ink);
  font:inherit;font-size:26px;font-weight:700;text-align:center}
.row button{height:56px;min-width:64px;border-radius:16px;border:0;background:var(--sky);color:var(--ink);font:inherit;font-size:20px;font-weight:700}
.quick{display:flex;gap:8px;margin-top:8px}
.quick button{flex:1;height:40px;border-radius:12px;border:0;background:var(--sky);color:var(--ink);font:inherit;font-size:16px;font-weight:600}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1;height:56px;border-radius:18px;border:0;font:inherit;font-size:20px;font-weight:700}
.primary{background:var(--gold);color:#3A2600}
.secondary{background:var(--sky);color:var(--ink)}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:16px;text-decoration:underline}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main>
  <button id="count" aria-label="Coin count. Triple-tap to edit"><svg class="c" viewBox="-20 -20 40 40" aria-hidden="true">
    <circle r="19.5" fill="#A8700A"/><circle r="18" fill="url(#gA)"/>
    <circle r="15" fill="none" stroke="#B8800C" stroke-width="1.6"/><circle r="15" cy=".8" fill="none" stroke="#FFF1B8" stroke-width=".9" opacity=".8"/>
    <use href="#star" transform="translate(0 1) scale(1.35)" fill="#A8700A" opacity=".55"/><use href="#star" transform="scale(1.35)" fill="#FFE27A"/>
    <ellipse cx="-8" cy="-9" rx="5" ry="2.2" transform="rotate(-35 -8 -9)" fill="#fff" opacity=".7"/></svg><span id="num">0</span></button>
  <div class="sub" id="sub">gold coins</div>
  <svg id="jar" viewBox="0 0 300 390" aria-hidden="true">
    <defs>
      <clipPath id="inside"><path d="M62 92 Q46 100 46 130 L46 340 Q46 372 80 372 L220 372 Q254 372 254 340 L254 130 Q254 100 238 92 Z"/></clipPath>
      <!-- coin faces: three slightly different golds so the pile doesn't look copy-pasted -->
      <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6C4"/><stop offset=".3" stop-color="#FFD84D"/><stop offset=".6" stop-color="#F3B41F"/><stop offset=".85" stop-color="#D4930F"/><stop offset="1" stop-color="#FFE27A"/></linearGradient>
      <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9A8"/><stop offset=".3" stop-color="#FFC83A"/><stop offset=".6" stop-color="#E8A014"/><stop offset=".85" stop-color="#C07A08"/><stop offset="1" stop-color="#F9D060"/></linearGradient>
      <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBE0"/><stop offset=".3" stop-color="#FBE27A"/><stop offset=".6" stop-color="#EDC23A"/><stop offset=".85" stop-color="#C99A18"/><stop offset="1" stop-color="#FFF0A0"/></linearGradient>
      <!-- coin edge: shaded like a cylinder -->
      <linearGradient id="gE"><stop offset="0" stop-color="#7A4E05"/><stop offset=".3" stop-color="#D9A21C"/><stop offset=".5" stop-color="#F5CF55"/><stop offset=".75" stop-color="#C98A0E"/><stop offset="1" stop-color="#6E4504"/></linearGradient>
      <path id="star" d="M0,-7L1.7,-2.35L6.66,-2.16L2.76,.9L4.11,5.66L0,2.9L-4.11,5.66L-2.76,.9L-6.66,-2.16L-1.7,-2.35Z"/>
      <!-- a coin lying flat, seen from slightly above: face at y=0, 4 units thick -->
      <g id="coinBody">
        <path d="M-19,0 A19,7.5 0 0 0 19,0 L19,4 A19,7.5 0 0 1 -19,4 Z" fill="url(#gE)"/>
        <path d="M-18.6,2.2 A18.6,7.3 0 0 0 18.6,2.2" fill="none" stroke="#8A5A06" stroke-width="3" stroke-dasharray=".9 1.2" opacity=".55"/>
      </g>
      <g id="coinTop">
        <ellipse rx="16.4" ry="6.3" fill="none" stroke="#B8800C" stroke-width="1.3"/>
        <ellipse rx="16.4" ry="6.3" cy=".45" fill="none" stroke="#FFF1B8" stroke-width=".7" opacity=".8"/>
        <use href="#star" transform="translate(0 .5) scale(1 .395)" fill="#A8700A" opacity=".55"/>
        <use href="#star" transform="scale(1 .395)" fill="#FFE27A"/>
        <ellipse cx="-8" cy="-3" rx="5" ry="1.3" transform="rotate(-12 -8 -3)" fill="#fff" opacity=".65"/>
      </g>
      <g id="cA"><use href="#coinBody"/><ellipse rx="19" ry="7.5" fill="url(#gA)"/><use href="#coinTop"/></g>
      <g id="cB"><use href="#coinBody"/><ellipse rx="19" ry="7.5" fill="url(#gB)"/><use href="#coinTop"/></g>
      <g id="cC"><use href="#coinBody"/><ellipse rx="19" ry="7.5" fill="url(#gC)"/><use href="#coinTop"/></g>
    </defs>
    <ellipse cx="150" cy="380" rx="120" ry="9" fill="rgba(0,0,0,.12)"/>
    <g clip-path="url(#inside)" id="coins"></g>
    <!-- glass -->
    <path d="M62 92 Q46 100 46 130 L46 340 Q46 372 80 372 L220 372 Q254 372 254 340 L254 130 Q254 100 238 92 Z"
      fill="var(--glass)" stroke="var(--glass-edge)" stroke-width="5" style="mix-blend-mode:normal" fill-opacity=".55"/>
    <path d="M66 140 Q64 240 70 330" stroke="rgba(255,255,255,.8)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M82 118 L82 126" stroke="rgba(255,255,255,.8)" stroke-width="9" stroke-linecap="round"/>
    <!-- neck + lid -->
    <rect x="70" y="72" width="160" height="24" rx="10" fill="var(--glass)" stroke="var(--glass-edge)" stroke-width="4"/>
    <rect x="58" y="34" width="184" height="42" rx="14" fill="var(--lid)"/>
    <rect x="58" y="62" width="184" height="14" rx="7" fill="var(--lid-dk)"/>
    <rect x="120" y="44" width="60" height="9" rx="4.5" fill="var(--lid-dk)"/>
    <rect x="74" y="40" width="40" height="7" rx="3.5" fill="rgba(255,255,255,.45)"/>
  </svg>
  <div class="hint" id="hint" hidden>Tap the jar, then tilt your phone! 📱</div>
</main>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js" integrity="sha512-6+7rTBmR6pRFe9fa0vCFjFaHZj/XYa7774bEBzRtxgdpIJOS++R3cKd6Prg/eJmxtsJotd8KAg4g57uuVQsZKA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let state={coins:store.get('cj_coins',10),full:store.get('cj_full',100)};
let pin=store.get('cj_pin',null);

// ---- jar: every coin is a Matter.js body inside the glass, drawn as an SVG <use> ----
const CAP=300; // above this, each coin shown stands for more than one (keeps phones smooth)
const {Engine,Bodies,Body,Composite,Sleeping,Events}=Matter;
const engine=Engine.create({enableSleeping:true,positionIterations:8,velocityIterations:6});
// static walls tracing the inside of the jar in viewBox units: floor 372, sides 46/254, lid 92
const wall=(x,y,w,h,a=0)=>Bodies.rectangle(x,y,w,h,{isStatic:true,angle:a,friction:.1});
Composite.add(engine.world,[wall(150,397,320,50),wall(150,67,320,50),wall(21,230,50,400),wall(279,230,50,400),
  wall(46,372,34,34,Math.PI/4),wall(254,372,34,34,Math.PI/4),wall(46,92,40,40,Math.PI/4),wall(254,92,40,40,Math.PI/4)]);
let L={},coins=[],wanted=0,dropTimer=0;
function layout(){
  const N=Math.max(1,Math.min(state.full,CAP));
  const per=Math.max(2,Math.round(Math.sqrt(N/4.76)));
  const rows=Math.ceil(N/per),sp=204/per,k=sp/34*1.05,rowH=(262-10*k)/Math.max(rows-1,1);
  // tumbling coins pack tighter the thinner they are, so body thickness grows with N; tuned so a
  // full jar fills to the shoulders (85–92% of the height) for any "full at" value up to CAP
  const cl=v=>Math.max(0,Math.min(1,v)),thick=.82+.23*cl((N-20)/30)+.5*cl((N-100)/200);
  const w=Math.min(sp*.9,36*k);
  // the drawing (38 units wide) just overhangs the body so coins don't vanish into the glass
  L={full:state.full,per,rows,sp,rowH,w,h:Math.min(rowH*thick,17*k),k:Math.min(k,w/33)};
}
function rnd(i){const x=Math.sin(i*9301+49297)*233280;return x-Math.floor(x)}
function draw({b,el}){
  el.setAttribute('transform',`translate(${b.position.x.toFixed(1)} ${b.position.y.toFixed(1)}) rotate(${(b.angle*57.2958).toFixed(1)}) translate(0 ${(-2*L.k).toFixed(2)}) scale(${L.k.toFixed(3)})`);
}
function addCoin(x,y,angle){
  const i=coins.length,b=Bodies.rectangle(x,y,L.w,L.h,{angle,friction:.15,frictionStatic:.3,restitution:.15,frictionAir:.012,
    chamfer:{radius:Math.min(L.w,L.h)*.3}});
  const el=document.createElementNS('http://www.w3.org/2000/svg','use');
  el.setAttribute('href','#c'+'ABC'[Math.floor(rnd(i+11)*3)]);
  $('#coins').appendChild(el);Composite.add(engine.world,b);
  const c={b,el};coins.push(c);draw(c);
}
function clearCoins(list){list.forEach(c=>{Composite.remove(engine.world,c.b);c.el.remove()})}
// how: 'place' stacks coins neatly (page load, new jar size); otherwise new coins drop in from the top
function sync(how){
  clearInterval(dropTimer);
  if(how==='place'){
    const {per,sp,rowH,w,h}=L;
    for(let i=coins.length;i<wanted;i++){
      const row=Math.floor(i/per),col=i%per,x=50+sp/2+(row%2?sp/2:0)+col*sp;
      addCoin(Math.min(Math.max(x,47+w/2),253-w/2),372-h/2-row*rowH,(rnd(i+3)-.5)*.3);
    }
  }
  if(coins.length>wanted){ // take coins off the top of the pile
    coins.sort((a,b)=>a.b.position.y-b.b.position.y);clearCoins(coins.splice(0,coins.length-wanted));
  }
  const n=wanted-coins.length;
  if(n>0)dropTimer=setInterval(()=>{
    if(coins.length>=wanted)return clearInterval(dropTimer);
    addCoin(75+Math.random()*150,98+Math.random()*8,(Math.random()-.5)*1.2);wake();
  },Math.max(15,Math.min(110,1500/n)));
  wake();
}
function render(how){
  if(L.full!==state.full){clearCoins(coins);coins=[];layout();how='place'}
  wanted=state.full<=CAP?Math.min(state.coins,state.full)
    :(state.coins>0?Math.max(1,Math.round(Math.min(state.coins/state.full,1)*CAP)):0);
  sync(how);
  $('#num').textContent=state.coins.toLocaleString();
  const pct=state.full>0?state.coins/state.full*100:0;
  const c=$('#count');c.classList.remove('red','amber','green');
  c.classList.add(pct>=80?'green':pct<=20?'red':'amber');
  $('#sub').textContent=state.coins===0?'the jar is empty':state.coins>=state.full?'the jar is full!':state.coins===1?'gold coin':'gold coins';
  c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');
}

// ---- simulation loop: fixed 60 Hz steps; stops when every coin is asleep to save battery ----
let raf=0,last=0,acc=0;
function wake(){coins.forEach(c=>Sleeping.set(c.b,false));if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(now){
  acc+=Math.min(now-last,100);last=now;
  while(acc>=1000/60){Engine.update(engine,1000/60);acc-=1000/60}
  let awake=0;for(const c of coins)if(!c.b.isSleeping){draw(c);awake++}
  raf=awake||coins.length<wanted?requestAnimationFrame(tick):0;
}

// ---- tilt: gravity follows the phone ----
// Screen gravity comes from the accelerometer (no gimbal lock when the phone is held upright).
// Browsers disagree on its sign, so the first clearly-tilted orientation reading calibrates it;
// the orientation angles alone are the fallback when there is no accelerometer.
let accelSign=0,usingAccel=false;
function toScreen(x,y){ // undo screen rotation (landscape)
  const a=((screen.orientation&&screen.orientation.angle)??window.orientation??0)*Math.PI/180;
  return [x*Math.cos(a)+y*Math.sin(a),-x*Math.sin(a)+y*Math.cos(a)];
}
function setGravity(x,y){
  const g=engine.gravity;x=g.x*.6+x*.4;y=g.y*.6+y*.4; // smooth out sensor jitter
  const moved=Math.hypot(x-g.x,y-g.y)>.02;g.x=x;g.y=y;if(moved)wake();
  $('#hint').hidden=true;
}
let orientG=null;
addEventListener('deviceorientation',e=>{
  if(e.beta==null||e.gamma==null)return;
  const r=Math.PI/180,b=e.beta*r,g=e.gamma*r;
  orientG=[Math.sin(g)*Math.cos(b),Math.sin(b)]; // world "down" projected onto a portrait screen
  if(!usingAccel)setGravity(...toScreen(...orientG));
});
addEventListener('devicemotion',e=>{
  const a=e.accelerationIncludingGravity;if(!a||a.x==null||a.y==null)return;
  let v=[-a.x/9.81,a.y/9.81]; // per spec a device at rest reports the upward reaction to gravity
  if(!accelSign){ // wait for a clear orientation reading, then check the accelerometer agrees
    if(!orientG||Math.hypot(...orientG)<.5||Math.hypot(...v)<.5)return;
    accelSign=v[0]*orientG[0]+v[1]*orientG[1]<0?-1:1;usingAccel=true;
  }
  setGravity(...toScreen(v[0]*accelSign,v[1]*accelSign));
});
// iPhone only lets a page read motion after a tap, so the first tap on the jar asks
const mustAsk=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
if(mustAsk)$('#hint').hidden=false;
function askForTilt(){
  if(!mustAsk)return;
  DeviceOrientationEvent.requestPermission().catch(()=>{});
  if(typeof DeviceMotionEvent.requestPermission==='function')DeviceMotionEvent.requestPermission().catch(()=>{});
}

// ---- shake (or tap the jar): toss the coins against gravity ----
function jolt(s=1){
  if(!coins.length)return;
  const g=engine.gravity,m=Math.hypot(g.x,g.y)||1,ux=-g.x/m||0,uy=m>0?-g.y/m:-1;
  wake();
  coins.forEach(({b})=>{const up=(1+Math.random()*4)*s,side=(Math.random()-.5)*5*s;
    Body.setVelocity(b,{x:b.velocity.x+ux*up-uy*side,y:b.velocity.y+uy*up+ux*side})});
}
let lastShake=0;
addEventListener('devicemotion',e=>{
  const a=e.acceleration,ag=e.accelerationIncludingGravity,now=Date.now();
  const m=a&&a.x!=null?Math.hypot(a.x,a.y,a.z):ag&&ag.x!=null?Math.abs(Math.hypot(ag.x,ag.y,ag.z)-9.81):0;
  if(m>14&&now-lastShake>300){lastShake=now;jolt(Math.min(1.6,m/14))}
});
$('#jar').addEventListener('click',()=>{
  askForTilt();
  const j=$('#jar');j.classList.remove('wiggle');void j.offsetWidth;j.classList.add('wiggle');
  jolt(.8);
});

// ---- sound: a metallic "ting" synthesised with a few inharmonic sine partials ----
let actx=null,lastClink=0,lastBuzz=0,soundOn=store.get('cj_sound',true);
function unlockAudio(){ // browsers only allow audio after a tap
  if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;actx=new A()}
  if(actx.state==='suspended')actx.resume();
}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
function clink(vol=1){
  if(!soundOn||!actx||actx.state!=='running')return;
  const t=actx.currentTime;if(t-lastClink<.035)return;lastClink=t; // many coins at once → a jingle, not a roar
  const f=1500+Math.random()*800,out=actx.createGain();out.gain.value=.1*vol;out.connect(actx.destination);
  [[1,1,.3],[2.76,.5,.18],[5.4,.25,.09]].forEach(([ratio,amp,decay])=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=f*ratio;o.connect(g);g.connect(out);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+decay);
    o.start(t);o.stop(t+decay+.02);
  });
}
// clink when coins actually hit something; a tiny buzz on hard hits (Android only — iPhone has no web vibration)
Events.on(engine,'collisionStart',e=>{
  for(const p of e.pairs){
    const s=Math.max(p.bodyA.speed,p.bodyB.speed);if(s<1.2)continue;
    clink(Math.min(1,.25+s/6));
    if(s>4&&navigator.vibrate&&navigator.userActivation?.hasBeenActive&&Date.now()-lastBuzz>80){lastBuzz=Date.now();navigator.vibrate(8)}
  }
});

// ---- triple tap ----
let taps=[];
$('#count').addEventListener('click',()=>{
  const now=Date.now();taps=taps.filter(t=>now-t<700);taps.push(now);
  if(taps.length>=3){taps=[];openPin(pin?'enter':'set1')}
});

// ---- sheet ----
const scrim=$('#scrim'),sheet=$('#sheet');
function close(){scrim.classList.remove('open')}
scrim.addEventListener('click',e=>{if(e.target===scrim)close()});
let entry='',firstPin='',mode='';
const copy={set1:['Create a passcode','Pick 4 digits only you know'],set2:['Confirm passcode','Enter the same 4 digits again'],
  enter:['Enter passcode','Grown-ups only'],change1:['New passcode','Pick 4 new digits'],change2:['Confirm new passcode','Enter the same 4 digits again']};
function openPin(m,err){
  mode=m;entry='';
  sheet.innerHTML=`<h2>${copy[m][0]}</h2><p class="hint ${err?'err':''}">${err||copy[m][1]}</p>
  <div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
  <button class="ghost" data-k="x">Cancel</button><button data-k="0">0</button><button class="ghost" data-k="b">Delete</button></div>`;
  scrim.classList.add('open');
  sheet.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>key(b.dataset.k));
}
function dots(){[...$('#dots').children].forEach((d,i)=>d.classList.toggle('on',i<entry.length))}
function key(k){
  if(k==='x')return close();
  if(k==='b'){entry=entry.slice(0,-1);return dots()}
  if(entry.length<4){entry+=k;dots()}
  if(entry.length===4)setTimeout(done,150);
}
function fail(msg,next){const d=$('#dots');d.classList.add('shake');setTimeout(()=>openPin(next,msg),350)}
function done(){
  if(mode==='set1'||mode==='change1'){firstPin=entry;openPin(mode==='set1'?'set2':'change2')}
  else if(mode==='set2'||mode==='change2'){
    if(entry===firstPin){pin=entry;store.set('cj_pin',pin);openEdit()}
    else fail('Those didn\u2019t match. Try again.',mode==='set2'?'set1':'change1');
  }
  else if(mode==='enter'){entry===pin?openEdit():fail('Wrong passcode. Try again.','enter')}
}
function openEdit(){
  sheet.innerHTML=`<h2>Set the coins</h2><p class="hint">Changes show in the jar right away</p>
  <label for="ci">Coins in the jar</label>
  <div class="row"><button data-d="-1" aria-label="Remove one">−</button><input id="ci" type="number" inputmode="numeric" min="0" value="${state.coins}"><button data-d="1" aria-label="Add one">+</button></div>
  <div class="quick"><button data-s="0">Empty</button><button data-d="-10">−10</button><button data-d="10">+10</button><button data-s="full">Fill up</button></div>
  <label for="fi">Jar is full at</label>
  <div class="row"><input id="fi" type="number" inputmode="numeric" min="1" value="${state.full}"></div>
  <div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>
  <button class="link" id="snd"></button>
  <button class="link" id="chg">Change passcode</button>`;
  scrim.classList.add('open');
  const ci=$('#ci'),fi=$('#fi');
  const val=()=>Math.max(0,parseInt(ci.value)||0);
  sheet.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>ci.value=Math.max(0,val()+ +b.dataset.d));
  sheet.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>ci.value=b.dataset.s==='full'?Math.max(1,parseInt(fi.value)||100):0);
  $('#cancel').onclick=close;
  $('#chg').onclick=()=>openPin('change1');
  const snd=$('#snd'),sndLabel=()=>snd.textContent=soundOn?'Sounds: on (tap to mute)':'Sounds: off (tap to turn on)';
  sndLabel();snd.onclick=()=>{soundOn=!soundOn;store.set('cj_sound',soundOn);sndLabel();clink()};
  $('#save').onclick=()=>{
    state.coins=val();state.full=Math.max(1,parseInt(fi.value)||100);
    store.set('cj_coins',state.coins);store.set('cj_full',state.full);
    close();
    render();
  };
}
render('place');
</script>
</body>
</html>
